      .reduce((n, r) => n + (r.requests || []).filter((q) => q.status === "pending").length, 0)
      + state.chats.filter((c) => !tripDone(c)).reduce((n, c) => n + unreadIn(c), 0);
    // Archive: a review still to leave, or something written after the trip.
    const archiveCount = state.chats.filter(tripDone)
      .reduce((n, c) => n + unreadIn(c) + (hasReviewed(c) ? 0 : 1), 0);
    const badgeFor = (id) => (id === "trips" ? tripsCount : id === "archive" ? archiveCount : 0);

    return `
    <div class="sticky top-0 z-40">
      ${banner}
      <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
          <button data-action="nav" data-view="find" class="rounded-lg" aria-label="Lifta home">${logo}</button>
          <nav class="hidden md:flex items-center gap-1" aria-label="Main">
            ${navItems().map((n) => `<button data-action="nav" data-view="${n.id}" ${state.view === n.id ? 'aria-current="page"' : ""}
              class="inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold transition-colors ${state.view === n.id ? "bg-ink text-white" : "text-slate-600 hover:bg-slate-100"}">
              ${icon(n.icon)}${n.label}
              ${badgeFor(n.id) ? `<span class="ml-0.5 h-5 px-1.5 rounded-full bg-sun text-ink text-xs font-bold grid place-items-center">${badgeFor(n.id)}</span>` : ""}
            </button>`).join("")}
          </nav>
        </div>
      </header>
    </div>

    <main class="pb-28 md:pb-16">${content}</main>

    <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 grid" style="grid-template-columns: repeat(${navItems().length}, minmax(0, 1fr))" aria-label="Main">
      ${navItems().map((n) => {
        const active = state.view === n.id;
        return `<button data-action="nav" data-view="${n.id}" ${active ? 'aria-current="page"' : ""}
          class="relative flex flex-col items-center gap-1 pt-3 pb-4 text-xs font-semibold ${active ? "text-teal-800" : "text-slate-500"}">
          ${active ? '<span class="absolute top-0 inset-x-6 h-1 rounded-b-full bg-teal-700" aria-hidden="true"></span>' : ""}
          <span class="relative">${icon(n.icon, "w-5 h-5")}
            ${badgeFor(n.id) ? `<span class="absolute -top-1.5 -right-2.5 w-4 h-4 rounded-full bg-sun text-ink font-bold grid place-items-center" style="font-size:10px">${badgeFor(n.id)}</span>` : ""}
          </span>${n.label}</button>`;
      }).join("")}
    </nav>`;
  }

  /* ---------- Signed out / needs invite ---------- */
  function signedOutView() {
    return `${banner}
    <div class="max-w-md mx-auto px-4 py-16">
      <div class="text-center">${logo}</div>
      <h1 class="mt-8 font-display text-4xl font-extrabold tracking-tight text-center leading-tight">Going somewhere? Take someone along.</h1>
      <p class="mt-4 text-lg text-slate-600 text-center leading-relaxed">Drivers with empty seats meet people heading the same way. Nobody pays. Everybody gets company.</p>
      <div class="card mt-10 p-6">
        <button data-action="google" class="btn-primary w-full py-3 text-base">${icon("log-in", "w-5 h-5")} Continue with Google</button>
        <p class="mt-4 text-sm text-slate-500 text-center">Lifta is invite-only. You need a code from someone who is already a member.</p>
        <p class="mt-3 text-sm text-slate-500 text-center">By joining you agree to the
          <button data-action="nav" data-view="legal" class="font-semibold text-teal-800 underline underline-offset-4">terms and privacy notice</button>.</p>
      </div>
      <p class="mt-6 text-center">
        <button data-action="nav" data-view="legal" class="text-sm font-semibold text-slate-600 underline underline-offset-4">What is Lifta, and who runs it?</button>
      </p>
      <ul class="mt-8 space-y-3 text-sm text-slate-600">
        <li class="flex gap-3">${icon("user", "w-4 h-4 shrink-0 mt-0.5")} Real names. You always know who you are riding with.</li>
        <li class="flex gap-3">${icon("ban", "w-4 h-4 shrink-0 mt-0.5")} No money, ever.</li>
        <li class="flex gap-3">${icon("trash-2", "w-4 h-4 shrink-0 mt-0.5")} Rides are deleted once they depart. We keep nothing we don't need.</li>
      </ul>
    </div>`;
  }

  function needsInviteView() {
    return `${banner}
    <div class="max-w-md mx-auto px-4 py-16">
      <div class="text-center">${logo}</div>
      <h1 class="mt-8 font-display text-3xl font-extrabold tracking-tight text-center">Almost in</h1>
      <p class="mt-3 text-slate-600 text-center">Signed in as ${esc(state.user.email)}. Add your invite code and your name.</p>
      <form id="join-lifta" class="card mt-8 p-6 space-y-5">
        <div>
          <label for="j-name" class="label">Your name</label>
          <input id="j-name" class="inp" placeholder="First Last" autocomplete="name" value="${esc(state.user.user_metadata?.full_name || "")}" />
          <p class="mt-1.5 text-sm text-slate-500">Use your real name. Others see it when you drive or ride along.</p>
        </div>
        <div>
          <label for="j-code" class="label">Invite code</label>
          <input id="j-code" class="inp uppercase tracking-widest" placeholder="ABC1234XYZ" autocomplete="off" maxlength="10" />
        </div>
        <p class="text-sm text-slate-600">By joining you agree to the
          <button type="button" data-action="nav" data-view="legal" class="font-semibold text-teal-800 underline underline-offset-4">terms and privacy notice</button>,
          including the rule that no money changes hands.</p>
        <button type="submit" class="btn-primary w-full py-3 text-base">Join Lifta</button>
      </form>
      <button data-action="signout" class="mt-6 w-full text-sm font-semibold text-slate-600 underline underline-offset-4">Sign out</button>
    </div>`;
  }

  // Shown once, to someone whose deleted account carried a block. It is the
  // only time they see the reference, so it is a page and not a toast.
  const BLOCK_REASONS = {
    money: "Asking for money", no_show: "Not showing up",
    pickup_changed: "Changing the agreed pickup", unsafe: "Unsafe driving or behaviour",
    harassment: "Harassment", parcel: "Asking someone to carry something",
    other: "A reported problem",
    suspended: "Your account was suspended",
  };

  function farewellView(b) {
    const until = new Date(b.expires_at).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    return `${banner}
    <div class="max-w-md mx-auto px-4 py-16">
      <div class="text-center">${logo}</div>
      <h1 class="mt-8 font-display text-3xl font-extrabold tracking-tight text-center">Your account is deleted</h1>
      <p class="mt-3 text-slate-600 text-center">Everything we held about you is gone.</p>

      <div class="card mt-8 p-6 border-amber-300 bg-amber-50">
        <p class="flex items-center gap-2 font-semibold">${icon("triangle-alert", "w-5 h-5")} You cannot rejoin until ${until}</p>
        <p class="mt-2 text-sm text-slate-700">Reason: ${esc(BLOCK_REASONS[b.reason] || "A reported problem")}.</p>

        <div class="mt-5 rounded-xl bg-white border border-amber-200 p-4 text-center">
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Your reference</p>
          <p class="mt-1 font-mono text-2xl font-bold tracking-widest">${esc(b.reference)}</p>
        </div>

        <p class="mt-4 text-sm text-slate-700">Write this down. If you think the block is wrong, contact the Lifta team and give them this reference. We keep no name and no address, so we cannot find your case without it.</p>
      </div>

      <button data-action="dismiss-farewell" class="mt-6 w-full text-sm font-semibold text-slate-600 underline underline-offset-4">Close</button>
    </div>`;
  }

  /* ---------- View: Terms and privacy ----------
     Written to match what the app actually does. If a rule changes in the
     database, it changes here too. Deliberately short: a document nobody
     reads protects nobody. */
  const CONTACT_EMAIL = "hello@theparea.app";
  const KOFI_URL = "https://ko-fi.com/theparea";

  function legalView() {
    const h2 = (t) => `<h2 class="font-display text-xl font-extrabold mt-8 mb-2">${t}</h2>`;
    const p  = (t) => `<p class="mt-2 text-slate-700 leading-relaxed">${t}</p>`;
    const li = (t) => `<li class="flex gap-3 text-slate-700 leading-relaxed">${icon("dot", "w-4 h-4 shrink-0 mt-1 text-slate-400")}<span>${t}</span></li>`;

    return `
    <div class="max-w-2xl mx-auto px-4 py-8 sm:py-12">
      <h1 class="font-display text-4xl sm:text-5xl font-extrabold tracking-tight">About, terms and privacy</h1>
      <p class="mt-3 text-lg text-slate-600">What Lifta is, what we expect of you, and what we do with your data. Last updated ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}.</p>

      <section class="card p-6 mt-8">
        ${h2("What Lifta is")}
        ${p("Lifta puts drivers with empty seats in touch with people going the same way. That is all it does. We do not arrange transport, we are not a taxi service, and we are not a party to your trip. What happens on the road is between the people in the car.")}

        ${h2("No money. Ever.")}
        ${p("This is the rule the whole thing rests on. You share a ride for the company, not for payment.")}
        <ul class="mt-3 space-y-2">
          ${li("Do not ask for money, fuel costs, favours or anything else in return for a ride.")}
          ${li("Do not offer them either. A driver who accepts once will be asked every time.")}
          ${li("Mentions of money and payment are blocked in ride notes, requests and trip messages.")}
          ${li("Asking for payment gets an account removed. Report it if it happens to you.")}
        </ul>
        ${p("Do not offer a tip at the end of a trip either. A tip is money with a friendlier name, and the driver has to be able to say no without feeling rude. Buying a coffee when you stop somewhere is different: that is two people being decent to each other, not payment for a ride. If you want to give something back, buy the coffee, or offer the drive next time if you have a car.")}
        ${p("None of this is about money being grubby. It is that the moment a sum is involved, there is something to argue about: whether it was enough, whether someone was short-changed, what the next passenger is expected to hand over. Without it there is nothing to fall out over, and the trip stays what it is meant to be.")}

        ${h2("Who can be here")}
        <ul class="mt-3 space-y-2">
          ${li("You must be 18 or older.")}
          ${li("Lifta is invite-only. Someone already here vouched for you, and you vouch for anyone you invite.")}
          ${li("Use your real name. Other people decide whether to get in a car with you based on it.")}
          ${li("One account per person.")}
        </ul>

        ${h2("Meeting points")}
        ${p("A meeting point is an area, not a pin. Naming a spot means an area roughly 200 metres across around it, and both of you are expected to wait inside that area. Nobody should have to walk half a kilometre looking for a car.")}
        ${p("Use public places: a square, a marina, a church car park, a petrol station. Never a home address. The exact meeting point is only shown once a seat is confirmed.")}

        ${h2("Driving")}
        <ul class="mt-3 space-y-2">
          ${li("If you drive, you need a valid licence, a roadworthy car and insurance that covers your passengers.")}
          ${li("Count only seats with a working seatbelt.")}
          ${li("Lifta does not check any of this. We cannot. That is one reason we are invite-only.")}
        </ul>
        ${p("Your passengers' own luggage is fine; that is what the bags tag is for. Carrying something for a person who is not in the car is not. If someone asks you to drop a parcel somewhere, say no. You do not have to explain why, and you can report it.")}

        ${h2("Where Lifta's part ends")}
        ${p("Lifta introduces people going the same way. That is all it does.")}
        ${p("Do not use Lifta for anything illegal. Do not arrange a trip in order to move drugs, contraband, or goods for someone who is not in the car. Accounts that do are removed.")}
        ${p("Once you meet, what happens between the meeting point and the destination is between the people in the car. We are not there. We are not a party to it, we do not endorse it, and we carry no responsibility for it. That is not us looking away; it is simply the truth of what this is.")}
        ${p("Anything criminal belongs with the police, not with us.")}

        ${h2("If something goes wrong")}
        ${p("Report it from the person's profile or from your trip messages. A reported thread is kept until we have looked at it. Serious problems, and anything criminal, belong with the police, not with us.")}
        ${p("You can block anyone. That closes any shared trip messages and hides you from each other.")}
      </section>

      <section class="card p-6 mt-6">
        <h2 class="font-display text-2xl font-extrabold">Your data</h2>
        ${p("The short version: we keep very little, and most of it deletes itself.")}

        ${h2("What we hold")}
        <ul class="mt-3 space-y-2">
          ${li("Your name, your email address, and anything you write in your profile.")}
          ${li("Rides you post, seats you request, and the messages on a trip.")}
          ${li("Reviews you write and receive.")}

        </ul>

        ${h2("How long")}
        <ul class="mt-3 space-y-2">
          ${li("<strong>A ride is deleted the moment it departs.</strong> It is used up, so it goes.")}
          ${li("<strong>Trip messages and the agreement: 5 days after arrival.</strong> Long enough to sort out a disagreement, then gone.")}
          ${li("<strong>A reported thread</strong> is kept until the case is closed, then 90 days.")}
          ${li("<strong>Reviews</strong> stay on the profile they are about, until that account is deleted.")}
          ${li("<strong>Unused invite codes</strong> expire after 14 days.")}
        </ul>

        ${h2("Deleting your account")}
        ${p("There is a button on your profile. It removes your profile, your rides, your requests, your trip messages and the reviews you received.")}
        ${p("Reviews you wrote about other people stay, with your name removed. They are information about those people, not about you, and removing them would punish someone else for your leaving.")}
        ${p("If your account was suspended or had an open report against it when you deleted it, we keep one thing for 12 months: a one-way fingerprint of your email address. Not the address itself. It cannot be turned back into an address and it cannot identify you. It answers one question: whether an address trying to join is the same one that left under a cloud. You are shown a reference code when this happens. Keep it. It is the only way we can find your case if you think the block is wrong, because we hold no name and no address.")}
        ${p("Someone who simply leaves is never blocked and is welcome back any time.")}

        ${h2("Your rights")}
        ${p(`Under the GDPR you can ask for a copy of your data, ask us to correct it, or ask us to delete it. Deletion is a button in the app. For anything else, write to <a href="mailto:${CONTACT_EMAIL}" class="font-semibold text-teal-800 underline underline-offset-4">${CONTACT_EMAIL}</a>. You can also complain to the Office of the Commissioner for Personal Data Protection in Cyprus.`)}

        ${h2("Where it lives")}
        ${p("Lifta runs on Supabase, with the database in Frankfurt, Germany. Your data stays in the EU. Signing in goes through Google, who tell us your name and email address and nothing else.")}
      </section>

      <section class="card p-6 mt-6">
        <h2 class="font-display text-2xl font-extrabold">About Lifta</h2>
        ${p("Most cars on this island have one person in them. Meanwhile someone else is making the same trip, alone, an hour later.")}
        ${p("Lifta is for the drive, not the destination. You are going anyway. Someone else is going the same way. An hour of conversation costs neither of you anything, and both of you arrive having had a better trip than you would have had alone.")}

        ${h2("Why the name")}
        ${p("<em>Parea</em> is a Greek word with no real translation. It means the people you spend your time with: the group you sit with, the company you keep. You can do something <em>me parea</em>, with others, instead of alone.")}

        ${p(`Lifta is built and run by Jasmin, one person in Cyprus, as a hobby project. There is no company behind it, no funding and no income. Nobody is trying to grow it into anything. If you want to say something about it, write to <a href="mailto:${CONTACT_EMAIL}" class="font-semibold text-teal-800 underline underline-offset-4">${CONTACT_EMAIL}</a>.`)}

        ${h2("What it costs")}
        ${p("About 13 euro a year. That is the domain. The database, the sign-in and the hosting are all on free plans, and the app is built so it stays that way: a ride is deleted when it departs, a thread after five days, so there is never much to store.")}
        ${p(`If you want to cover a coffee towards it, there is a link: <a href="${KOFI_URL}" target="_blank" rel="noopener" class="font-semibold text-teal-800 underline underline-offset-4">ko-fi.com/theparea</a>. It buys you nothing here. No badge, no priority, no mention anywhere. The rule about money applies to me as well.`)}

      <section class="rounded-2xl bg-ink text-white p-6 mt-6">

        <p class="mt-3 text-slate-200 leading-relaxed">Lifta is run by one person as a hobby project, with no income and no company behind it. We check nobody's licence, nobody's insurance and nobody's driving. What we do is keep the circle small, make everyone use their real name, and remove people who cause problems.</p>
        <p class="mt-3 text-slate-200 leading-relaxed">Decide for yourself who you ride with. Tell someone where you are going. If a trip feels wrong, do not get in the car.</p>
      </section>

      <p class="mt-6 text-sm text-slate-500">Questions about any of this: <a href="mailto:${CONTACT_EMAIL}" class="font-semibold text-teal-800 underline underline-offset-4">${CONTACT_EMAIL}</a></p>
    </div>`;
  }

  /* ---------- The page a friend sees ----------
     No account, no sign-in, nothing to click. First names, the route and
     the times. Enough for someone to know where you are and who you are
     with, and not enough to find either of you. */
  function sharedTripView(t) {
    const arrives = t.arrives_about ? formatTime(t.arrives_about) : null;
    return `${banner}
    <div class="max-w-md mx-auto px-4 py-12">

        <div class="flex gap-3">

            <span class="road-v flex-1 my-1.5"></span>
            ${icon("map-pin", "w-5 h-5 text-ink fill-sun")}
          </div>

            <div>

            </div>
          </div>
        </div>

        <div class="mt-6 pt-5 border-t border-slate-100">
          <p class="text-sm text-slate-500">Who is in the car</p>
          <div class="mt-2 flex items-center gap-4">
            <span class="flex items-center gap-2">${avatar(t.driver, "sm")}
              <span><span class="block font-semibold">${esc(t.driver)}</span>
              <span class="block text-sm text-slate-500">driving</span></span></span>
            <span class="flex items-center gap-2">${avatar(t.passenger, "sm")}

      <div class="mt-8 rounded-2xl bg-ink text-white p-5">
        <p class="font-display text-lg font-extrabold">What is Lifta?</p>

      </div>
    </div>`;
  }

  /* ---------- Render ---------- */
  function render() {
    const app = $("#app");
    // Someone opened a shared link. That page is all they get.
    if (state.shared) { app.innerHTML = sharedTripView(state.shared); refreshIcons(); return; }
    const farewell = sessionStorage.getItem("lifta-farewell");
    if (farewell && !state.user) { app.innerHTML = farewellView(JSON.parse(farewell)); refreshIcons(); return; }
    // The terms have to be readable before you join, not only after.
    if (state.view === "legal" && (!state.user || !state.profile)) {
      app.innerHTML = `${banner}
        <header class="bg-white border-b border-slate-200">
          <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            ${logo}
            <button data-action="nav" data-view="find" class="text-sm font-semibold text-slate-600 hover:underline">Back</button>
          </div>
        </header>${legalView()}`;
      refreshIcons();
      return;
    }
    if (!state.user) { app.innerHTML = signedOutView(); }
    else if (!state.profile) { app.innerHTML = needsInviteView(); }
    else {
      const content = state.view === "find" ? findView()
                    : state.view === "post" ? postView()
                    : state.view === "trips" ? tripsView()
                    : state.view === "archive" ? archiveView()
                    : state.view === "admin" ? adminView()
                    : state.view === "legal" ? legalView()
                    : profileView();
      app.innerHTML = shell(content);
      if (state.view === "find") { renderResults(); state.heroPlayed = true; }
    }
    renderModal();
    refreshIcons();
  }

  /* ---------- Data ---------- */
  async function loadSession() {
    // A shared link is answered before we care who is signed in.
    const params = new URLSearchParams(location.search);
    // theparea.app/?about lands a curious stranger on the explanation
    // rather than on a sign-in screen they cannot get past.
    if (params.has("about")) state.view = "legal";
    const token = params.get("t");
    if (token) {
      const { data } = await db.rpc("view_shared_trip", { p_token: token });
      if (data) { state.shared = data; state.loading = false; return render(); }
      state.loading = false;
      toast("That link has expired or is no longer valid.", "error");
    }

    const { data: { session } } = await db.auth.getSession();
    state.user = session?.user || null;
    state.profile = null;
    if (!state.user) { state.loading = false; return render(); }

    const { data: p, error: pErr } = await db.from("profiles").select(PROFILE_COLS).eq("id", state.user.id).maybeSingle();
    if (pErr) {
      // A failed lookup is not the same as "no account". Say so, rather than
      // sending an existing member back to the invite screen.
      state.loading = false;
      toast("Could not load your profile. Check your connection and reload.", "error");
      return render();
    }
    state.profile = p || null;
    if (!p) { state.loading = false; return render(); }

    const [{ data: cities }, { data: invites }] = await Promise.all([
      db.from("cities").select("*").order("sort"),
      db.from("invites").select("*").order("created_at", { ascending: false }),
    ]);
    state.cities = cities || [];
    state.invites = invites || [];
    render();
    await loadRides();
  }

  async function loadRides() {
    state.loading = true;
    renderResults();

    // Rides with their driver, plus the requests on my own rides.
    const [{ data: rides, error }, { data: mine }, { data: ratings }] = await Promise.all([
      db.from("rides")
        .select("*, driver:profiles!rides_driver_id_fkey(id, full_name, bio, verification_level, created_at), requests:ride_requests(*, passenger:profiles!ride_requests_passenger_id_fkey(id, full_name, verification_level))")
        .order("departs_at"),
      db.from("ride_requests").select("*").eq("passenger_id", state.user.id).in("status", ["pending", "accepted"]),
      db.from("profile_ratings").select("*").eq("role", "driver"),
    ]);

    state.loading = false;
    if (error) { toast(error.message, "error"); return renderResults(); }

    const byDriver = Object.fromEntries((ratings || []).map((r) => [r.subject_id, r]));
    state.rides = (rides || []).map((r) => ({ ...r, driverRating: byDriver[r.driver_id] }));
    state.myRequests = mine || [];
    await Promise.all([loadChats(), loadRequesters()]);
    startRealtime();
    render();
  }

  // Chats outlive their ride: the ride row is deleted at departure, but the
  // chat holds its own copy of the agreement for 5 more days.
  async function loadChats() {
    const { data } = await db.from("chats")
      .select("*, driver:profiles!chats_driver_id_fkey(id, full_name, verification_level), passenger:profiles!chats_passenger_id_fkey(id, full_name, verification_level), messages(id, sender_id)")
      .order("departs_at", { ascending: false });
    state.chats = data || [];
  }

  async function openMessages(chatId) {
    state.modal = { type: "messages", chatId };
    state.messages = [];
    renderModal();
    const [{ data }, { data: shares }] = await Promise.all([
      db.from("messages").select("*").eq("chat_id", chatId).order("created_at"),
      db.from("trip_shares").select("token").eq("chat_id", chatId).is("revoked_at", null).gt("expires_at", new Date().toISOString()),
    ]);
    if (shares && shares.length) state.shareLinks[chatId] = shares[0].token;
    state.messages = data || [];
    if (state.messages.length) markSeen(chatId, state.messages[state.messages.length - 1].id);
    renderModal();
    render();
  }

  async function sendMessage(text) {
    const body = (text || "").trim();
    if (!body || !state.modal) return;
    if (MONEY.test(body) || LINK.test(body)) return toast("No money and no links in trip messages.", "error");
    state.busy = true;
    const { error } = await db.from("messages").insert({ chat_id: state.modal.chatId, sender_id: state.user.id, body });
    state.busy = false;
    if (error) return toast(error.message, "error");
    const { data } = await db.from("messages").select("*").eq("chat_id", state.modal.chatId).order("created_at");
    state.messages = data || [];
    renderModal();
  }

  // Admin data. The database decides what comes back: a non-admin gets
  // only their own reports, and no member list beyond what anyone sees.
  async function loadAdmin() {
    const [{ data: reports }, { data: members }, { data: words }, { data: blocks }, { data: usage }] = await Promise.all([
      db.from("reports").select("*").order("created_at", { ascending: false }),
      db.from("profiles").select(PROFILE_COLS).order("created_at"),
      db.from("blocked_words").select("*").order("word"),
      db.rpc("admin_list_blocks"),
      db.rpc("admin_usage"),
    ]);
    state.admin.reports = reports || [];
    state.admin.members = members || [];
    state.admin.words = words || [];
    state.admin.blocks = blocks || [];
    state.admin.usage = usage || null;
    state.admin.people = Object.fromEntries((members || []).map((p) => [p.id, p]));
  }

  // Reviews with the author's name attached, so a review reads like a person
  // said it rather than appearing from nowhere.
  async function fetchReviews(personId) {
    const { data } = await db.from("reviews")
      .select("*, author:profiles!reviews_author_id_fkey(full_name)")
      .eq("subject_id", personId)
      .order("created_at", { ascending: false });
    return (data || []).map((r) => ({ ...r, authorName: r.author?.full_name }));
  }

  async function loadMyReviews() {
    const [reviews, { data: rs }] = await Promise.all([
      fetchReviews(state.user.id),
      db.from("profile_ratings").select("*").eq("subject_id", state.user.id),
    ]);
    state.myReviews = reviews;
    state.myRatings = {
      driver: (rs || []).find((r) => r.role === "driver"),
      passenger: (rs || []).find((r) => r.role === "passenger"),
    };
  }

  // Anyone asking to join one of my rides: pull their standing, so the
  // driver decides with the same information a passenger would have.
  async function loadRequesters() {
    const ids = [...new Set(state.rides
      .filter((r) => r.driver_id === state.user.id)
      .flatMap((r) => (r.requests || []).filter((q) => q.status === "pending").map((q) => q.passenger_id)))];
    if (!ids.length) return;

    const [{ data: rs }, { data: rv }] = await Promise.all([
      db.from("profile_ratings").select("*").in("subject_id", ids),
      db.from("reviews").select("*, author:profiles!reviews_author_id_fkey(full_name)")
        .in("subject_id", ids).order("created_at", { ascending: false }),
    ]);

    ids.forEach((id) => {
      state.people[id] = {
        driver: (rs || []).find((x) => x.subject_id === id && x.role === "driver"),
        passenger: (rs || []).find((x) => x.subject_id === id && x.role === "passenger"),
        reviews: (rv || []).filter((x) => x.subject_id === id).map((x) => ({ ...x, authorName: x.author?.full_name })),
      };
    });
  }

  /* ---------- Realtime ----------
     Someone standing at a meeting point should not have to reload the page.
     Messages and seat requests arrive as they happen. Rides are not urgent,
     so they stay on a timer. */
  let channel = null;

  function startRealtime() {
    if (channel) return;
    channel = db.channel("lifta")
      // A message in one of my threads.
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async (payload) => {
        const msg = payload.new;
        const mine = state.chats.some((c) => c.id === msg.chat_id);
        if (!mine) return;

        // Keep the unread count honest even when the thread is closed.
        const chat = chatById(msg.chat_id);
        if (chat) chat.messages = [...(chat.messages || []), { id: msg.id, sender_id: msg.sender_id }];

        if (state.modal?.type === "messages" && state.modal.chatId === msg.chat_id) {
          state.messages = [...state.messages, msg];
          markSeen(msg.chat_id, msg.id);
          renderModal();
        } else if (msg.sender_id && msg.sender_id !== state.user.id) {
          const other = chat ? otherPerson(chat) : null;
          toast(`New message from ${firstName(other?.full_name) || "your trip"}`, "ok");
        }
        render();
      })
      // Someone asks for a seat, or a driver answers mine.
      .on("postgres_changes", { event: "*", schema: "public", table: "ride_requests" }, async (payload) => {
        const row = payload.new || payload.old;
        const onMyRide = state.rides.some((r) => r.id === row.ride_id && r.driver_id === state.user.id);
        const isMine = row.passenger_id === state.user.id;
        if (!onMyRide && !isMine) return;

        await loadRides();
        if (payload.eventType === "INSERT" && onMyRide) toast("Someone asked to join one of your rides.");
        if (payload.eventType === "UPDATE" && isMine && payload.new.status === "accepted") {
          toast("Your seat is confirmed.");
        }
      })
      .subscribe();
  }

  /* ---------- Actions ---------- */
  document.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-action]");
    if (!el || state.busy) return;
    const { action, id } = el.dataset;

    switch (action) {
      case "google": {
        state.busy = true;
        const { error } = await db.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.href.split("#")[0] } });
        state.busy = false;
        if (error) toast(error.message, "error");
        break;
      }

      case "signout":
        await db.auth.signOut();
        location.reload();
        break;

      case "nav":
        state.view = el.dataset.view;
        state.modal = null;
        state.confirmDelete = null;
        if (state.view === "admin") {
          state.admin.readingChat = null;
          state.admin.chatMessages = [];
          await loadAdmin();
        }
        if (state.view === "profile") await loadMyReviews();
        render();
        window.scrollTo(0, 0);
        break;

      case "admin-read": {
        state.busy = true;
        const { data, error } = await db.rpc("admin_read_chat", { p_chat: id });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.admin.readingChat = id;
        state.admin.chatMessages = data || [];
        render();
        break;
      }

      case "admin-close": {
        if (!confirm("Close this case? The thread is then kept 90 more days and deleted.")) return;
        state.busy = true;
        const { error } = await db.rpc("admin_close_report", { p_report: id });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.admin.readingChat = null;
        await loadAdmin();
        render();
        toast("Case closed.");
        break;
      }

      case "admin-suspend": {
        if (!confirm("Suspend this account? They can't post, join or send messages until you restore it.")) return;
        state.busy = true;
        const { error } = await db.rpc("admin_set_member", { p_user: id, p_status: "suspended", p_can_invite: false });
        state.busy = false;
        if (error) return toast(error.message, "error");
        await loadAdmin();
        render();
        toast("Account suspended.");
        break;
      }

      case "admin-restore": {
        state.busy = true;
        const { error } = await db.rpc("admin_set_member", { p_user: id, p_status: "active", p_can_invite: true });
        state.busy = false;
        if (error) return toast(error.message, "error");
        await loadAdmin();
        render();
        toast("Account restored.");
        break;
      }

      case "lift-block": {
        if (!confirm(`Lift block ${id}? That address can join Lifta again.`)) return;
        state.busy = true;
        const { error } = await db.rpc("admin_lift_block", { p_reference: id });
        state.busy = false;
        if (error) return toast(error.message, "error");
        await loadAdmin();
        render();
        toast("Block lifted.");
        break;
      }

      case "admin-unword": {
        state.busy = true;
        const { error } = await db.from("blocked_words").delete().eq("word", id);
        state.busy = false;
        if (error) return toast(error.message, "error");
        await loadAdmin();
        render();
        break;
      }

      case "swap": {
        const f = state.filters;
        [f.from, f.to] = [f.to, f.from];
        render();
        break;
      }

      case "filter-vibe": {
        const v = state.filters.vibes;
        state.filters.vibes = v.includes(id) ? v.filter((x) => x !== id) : [...v, id];
        $("#vibe-filters").innerHTML = vibeChips();
        renderResults();
        break;
      }

      case "clear-filters":
        state.filters = { from: "", to: "", when: "any", vibes: [] };
        render();
        break;

      case "step": {
        const group = el.parentElement;
        const min = +group.dataset.min, max = +group.dataset.max;
        const obj = el.dataset.target === "join" ? state.modal : state.form;
        obj.seats = Math.min(max, Math.max(min, obj.seats + Number(el.dataset.delta)));
        group.querySelector("span").textContent = obj.seats;
        const [dec, inc] = group.querySelectorAll("button");
        dec.disabled = obj.seats <= min;
        inc.disabled = obj.seats >= max;
        break;
      }

      case "form-vibe": {
        const v = state.form.vibes;
        state.form.vibes = v.includes(id) ? v.filter((x) => x !== id) : [...v, id];
        $("#form-vibes").innerHTML = formVibes();
        refreshIcons();
        break;
      }

      case "add-point":
        readForm();
        state.form.points.push("");
        render();
        break;

      case "remove-point":
        readForm();
        state.form.points.splice(Number(id), 1);
        render();
        break;

      case "open-join": {
        const r = rideById(id);
        state.modal = { type: "join", rideId: id, seats: 1, pickup: r.meeting_points[0] };
        renderModal();
        break;
      }

      case "dismiss-farewell":
        sessionStorage.removeItem("lifta-farewell");
        render();
        break;

      case "toggle-reviews":
        state.showAllReviews[id] = !state.showAllReviews[id];
        render();
        renderModal();
        break;

      case "open-profile": {
        const { data: p } = await db.from("profiles").select(PROFILE_COLS).eq("id", id).maybeSingle();
        const { data: rs } = await db.from("profile_ratings").select("*").eq("subject_id", id);
        state.modal = {
          type: "profile", person: p, reviews: null,
          asDriver: (rs || []).find((r) => r.role === "driver"),
          asPassenger: (rs || []).find((r) => r.role === "passenger"),
        };
        renderModal();
        state.modal.reviews = await fetchReviews(id);
        renderModal();
        break;
      }

      case "close-modal":
        state.modal = null;
        renderModal();
        break;

      case "confirm-join": {
        const m = state.modal;
        const msg = $("#join-msg").value.trim();
        if (MONEY.test(msg) || LINK.test(msg)) return;
        state.busy = true;
        const { error } = await db.rpc("request_seat", { p_ride: m.rideId, p_seats: m.seats, p_pickup: m.pickup, p_message: msg });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.modal = null;
        await loadRides();
        toast("Request sent. The driver decides from here.");
        break;
      }

      case "withdraw": {
        state.busy = true;
        const { error } = await db.rpc("cancel_request", { p_request: id });
        state.busy = false;
        if (error) return toast(error.message, "error");
        await loadRides();
        toast("Done. The seat is open again.");
        break;
      }

      case "respond": {
        const accept = el.dataset.accept === "1";
        state.busy = true;
        const { error } = await db.rpc("respond_request", { p_request: id, p_accept: accept });
        state.busy = false;
        if (error) return toast(error.message, "error");
        await loadRides();
        toast(accept ? "Accepted. They're riding with you." : "Request declined.");
        break;
      }

      case "ask-delete":
        state.confirmDelete = id;
        render();
        break;

      case "cancel-delete":
        state.confirmDelete = null;
        render();
        break;

      case "delete-ride": {
        state.busy = true;
        const { error } = await db.from("rides").delete().eq("id", id);
        state.busy = false;
        state.confirmDelete = null;
        if (error) return toast(error.message, "error");
        await loadRides();
        toast("Ride cancelled.");
        break;
      }

      case "invite": {
        state.busy = true;
        const { data, error } = await db.rpc("create_invite");
        state.busy = false;
        if (error) return toast(error.message, "error");
        const { data: inv } = await db.from("invites").select("*").order("created_at", { ascending: false });
        state.invites = inv || [];
        render();
        toast(`Code created: ${data}`);
        break;
      }

      case "open-messages":
        await openMessages(id);
        break;

      case "quick":
        await sendMessage(el.dataset.text);
        break;

      case "share-trip": {
        state.busy = true;
        const { data, error } = await db.rpc("share_trip", { p_chat: id });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.shareLinks[id] = data;
        renderModal();
        break;
      }

      case "copy-share": {
        const url = location.origin + location.pathname + "?t=" + state.shareLinks[id];
        try { await navigator.clipboard.writeText(url); toast("Link copied. Send it to someone you trust."); }
        catch { toast("Select the link and copy it manually.", "error"); }
        break;
      }

      case "revoke-share": {
        state.busy = true;
        const { error } = await db.rpc("revoke_trip_share", { p_token: state.shareLinks[id] });
        state.busy = false;
        if (error) return toast(error.message, "error");
        delete state.shareLinks[id];
        renderModal();
        toast("That link no longer works.");
        break;
      }

      case "open-review":
        state.modal = { type: "review", chatId: id, rating: 0 };
        renderModal();
        break;

      case "set-rating":
        state.modal.rating = Number(id);
        renderModal();
        break;

      case "send-review": {
        const m = state.modal;
        const body = $("#rev-body").value.trim();
        if (!m.rating) return;
        if (MONEY.test(body) || LINK.test(body)) return toast("Remove anything about money or links.", "error");
        state.busy = true;
        const { error } = await db.rpc("submit_review", { p_chat: m.chatId, p_rating: m.rating, p_body: body });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.modal = null;
        await loadChats();
        render();
        toast("Review saved. It stays on their profile.");
        break;
      }

      case "open-report":
        state.modal = { type: "report", personId: id, chatId: el.dataset.chat || null, reason: "" };
        renderModal();
        break;

      case "report":
        state.modal = { type: "report", personId: id, chatId: null, reason: "" };
        renderModal();
        break;

      case "send-report": {
        const m = state.modal;
        if (!m.reason) return;
        const details = $("#rep-details")?.value.trim() || "";
        state.busy = true;
        const { error } = await db.rpc("report", { p_reported: m.personId, p_reason: m.reason, p_details: details, p_chat: m.chatId });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.modal = null;
        await loadChats();
        render();
        toast("Thank you. The Lifta team will look at this.");
        break;
      }

      case "block": {
        if (!confirm("Block this person? Your shared trip messages close and you won't see each other's rides.")) return;
        state.busy = true;
        const { error } = await db.rpc("block_user", { p_user: id });
        state.busy = false;
        if (error) return toast(error.message, "error");
        state.modal = null;
        await loadRides();
        toast("Blocked.");
        break;
      }

      case "delete-account": {
        if (!confirm("Delete your account and all your data? This cannot be undone.")) return;
        const { data, error } = await db.rpc("delete_my_account");
        if (error) return toast(error.message, "error");
        await db.auth.signOut();
        // A block only exists if they left suspended or under an open report.
        // Show it once, in full, with the reference they will need.
        if (data) {
          sessionStorage.setItem("lifta-farewell", JSON.stringify(data));
        }
        location.reload();
        break;
      }
    }
  });

  // Keep the post form in state so a re-render doesn't lose what was typed.
  function readForm() {
    const g = (sel) => document.querySelector(sel);
    if (g("#f-from")) state.form.from = g("#f-from").value;
    if (g("#f-to")) state.form.to = g("#f-to").value;
    if (g("#f-departs")) state.form.departs = g("#f-departs").value;
    if (g("#f-note")) state.form.note = g("#f-note").value;
    const pledge = document.querySelector('[data-field="pledge"]');
    if (pledge) state.form.pledge = pledge.checked;
    const pts = [...document.querySelectorAll("[data-point]")];
    if (pts.length) state.form.points = pts.map((i) => i.value);
  }

  function onChange(e) {
    const t = e.target;

    if (t.dataset.filter) {
      state.filters[t.dataset.filter] = t.value;
      renderResults();
    }

    if (t.dataset.field) {
      state.form[t.dataset.field] = t.type === "checkbox" ? t.checked : t.value;
      if (t.dataset.field === "note") {
        const bad = MONEY.test(t.value) || LINK.test(t.value);
        const help = $("#note-help");
        help.textContent = noteHelp();
        help.className = `mt-1.5 text-sm ${bad ? "text-rose-700" : "text-slate-500"}`;
        t.classList.toggle("inp-error", bad);
      }
    }

    if (t.dataset.point !== undefined) state.form.points[Number(t.dataset.point)] = t.value;

    if (t.hasAttribute?.("data-pickup") && state.modal) {
      state.modal.pickup = t.value;
      renderModal();
    }

    if (t.id === "join-msg") {
      const bad = MONEY.test(t.value) || LINK.test(t.value);
      const help = $("#join-help");
      help.textContent = bad ? "Remove anything about money or links. Lifta rides are free." : "The driver sees this with your request.";
      help.className = `mt-1.5 text-sm ${bad ? "text-rose-700" : "text-slate-500"}`;
      t.classList.toggle("inp-error", bad);
      $("#join-confirm").disabled = bad;
    }

    if (t.hasAttribute?.("data-reason") && state.modal) {
      state.modal.reason = t.value;
      renderModal();
    }

    if (t.id === "msg-input") {
      const bad = MONEY.test(t.value) || LINK.test(t.value);
      const help = $("#msg-help");
      help.textContent = bad ? "Remove anything about money or links. Lifta rides are free." : "No money and no links. Keep it to the trip.";
      help.className = `mt-1.5 text-sm ${bad ? "text-rose-700" : "text-slate-500"}`;
      t.classList.toggle("inp-error", bad);
    }

    if (t.id === "rev-body") {
      const bad = MONEY.test(t.value) || LINK.test(t.value);
      const help = $("#rev-help");
      help.textContent = bad ? "Remove anything about money or links." : `${t.value.length}/150. Keep it short and about the person.`;
      help.className = `mt-1.5 text-sm ${bad ? "text-rose-700" : "text-slate-500"}`;
    }

    if (t.id === "p-bio") {
      const bad = MONEY.test(t.value) || LINK.test(t.value);
      const help = $("#bio-help");
      help.textContent = bad ? "Remove anything about money or links." : `${t.value.length}/300. No money or links.`;
      help.className = `mt-1.5 text-sm ${bad ? "text-rose-700" : "text-slate-500"}`;
    }
  }
  document.addEventListener("input", onChange);
  document.addEventListener("change", onChange);

  document.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (state.busy) return;

    if (e.target.id === "join-lifta") {
      const name = $("#j-name").value.trim();
      const code = $("#j-code").value.trim();
      if (name.length < 2) return toast("Add your name.", "error");
      if (!code) return toast("Add your invite code.", "error");
      state.busy = true;
      const { error } = await db.rpc("redeem_invite", { invite_code: code, full_name: name });
      state.busy = false;
      if (error) return toast(error.message, "error");
      await loadSession();
      toast("Welcome to Lifta.");
    }

    if (e.target.id === "msg-form") {
      const input = $("#msg-input");
      const body = input.value;
      input.value = "";
      await sendMessage(body);
    }

    if (e.target.id === "word-form") {
      const word = $("#word-input").value.trim().toLowerCase();
      if (!/^[a-z0-9åäöéèüñ]+$/i.test(word)) return toast("One word only, letters and numbers.", "error");
      state.busy = true;
      const { error } = await db.from("blocked_words").insert({ word });
      state.busy = false;
      if (error) return toast(error.message, "error");
      await loadAdmin();
      render();
      toast(`"${word}" is now blocked in trip messages.`);
    }

    if (e.target.id === "ride-form") { readForm(); await submitRide(); }

    if (e.target.id === "bio-form") {
      const bio = $("#p-bio").value.trim();
      state.busy = true;
      const { error } = await db.from("profiles").update({ bio }).eq("id", state.user.id);
      state.busy = false;
      if (error) return toast(error.message, "error");
      state.profile.bio = bio;
      toast("Saved.");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.modal) { state.modal = null; renderModal(); }
  });

  /* ---------- Start ---------- */
  db.auth.onAuthStateChange((evt) => { if (evt === "SIGNED_IN" || evt === "SIGNED_OUT") loadSession(); });
  loadSession();
  // Messages and requests arrive live. Rides only need a periodic check,
  // mostly so departed ones disappear on their own.
  setInterval(() => {
    if (state.profile && document.visibilityState === "visible" && !state.modal) loadRides();
  }, 60000);
  </script>
</body>
</html>
