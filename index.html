<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lifta | Community ridesharing for company</title>
  <meta name="description" content="Community ridesharing for company, never for money." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) tailwind.config = {
      theme: { extend: {
        colors: { ink: "#102A3A", sun: "#FFC53D", paper: "#F4F7F5", road: "#2B4254" },
        fontFamily: { display: ['"Bricolage Grotesque"', "Figtree", "sans-serif"], sans: ["Figtree", "system-ui", "sans-serif"] },
      } },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style type="text/tailwindcss">
    @layer components {
      .inp { @apply w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-base text-ink placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600; }
      .inp-error { @apply border-rose-400; }
      .label { @apply block text-sm font-semibold text-slate-700 mb-1.5; }
      .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-full bg-ink px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-teal-800 disabled:opacity-40 disabled:cursor-not-allowed; }
      .btn-ghost { @apply inline-flex items-center justify-center gap-2 rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold hover:bg-slate-50 disabled:opacity-40; }
      .card { @apply bg-white rounded-2xl border border-slate-200; }
      .chip { @apply inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm font-medium transition-colors; }
      .chip-off { @apply bg-white border-slate-300 text-slate-700 hover:border-slate-400; }
      .chip-on { @apply bg-ink text-white border-transparent; }
      .tag { @apply inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700; }
      .pill { @apply inline-flex items-center gap-1.5 rounded-full px-3 py-2 text-sm font-semibold; }
    }
  </style>

  <style>
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; }

    /* The road motif: asphalt with a dashed centre line */
    .road-v { width: 10px; border-radius: 999px; min-height: 28px;
      background-color: #2B4254;
      background-image: linear-gradient(to bottom, #FFC53D 0 55%, transparent 55% 100%);
      background-size: 2px 10px; background-repeat: repeat-y; background-position: center top; }
    .road-h-sm { width: 36px; height: 8px; border-radius: 999px; flex-shrink: 0;
      background-color: #2B4254;
      background-image: linear-gradient(to right, #FFC53D 0 55%, transparent 55% 100%);
      background-size: 9px 2px; background-repeat: repeat-x; background-position: left center; }
    .road-hero { height: 46px; background-color: #1C3B4F;
      background-image: linear-gradient(to right, #FFC53D 0 50%, transparent 50% 100%);
      background-size: 40px 3px; background-repeat: repeat-x; background-position: left center; }
    .hero-car { position: absolute; left: 0; top: 50%; margin-top: -16px; transform: translateX(72vw);
      animation: drive 2.6s cubic-bezier(.22,.8,.3,1) .35s both; }
    .hero-car.parked { animation: none; }
    @keyframes drive { from { transform: translateX(-60px); } to { transform: translateX(72vw); } }

    .pop { animation: pop .18s ease-out both; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .hero-car, .pop, .spin { animation: none; } }
  </style>
</head>

<body class="bg-paper text-ink font-sans antialiased">
  <div id="app" class="min-h-screen"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="fixed z-50 bottom-24 md:bottom-6 inset-x-4 md:inset-x-auto md:right-6 flex flex-col gap-2 md:w-96" aria-live="polite"></div>

  <script>
  /* =====================================================================
     Lifta: community ridesharing for company, never for money.
     Everything lives in Supabase. The rules that matter (no money, no
     links, who may read what, rides deleted at departure) are enforced
     in the database, not here.
     ===================================================================== */

  const SUPABASE_URL = "https://nboyoauxhojfnvpamzna.supabase.co";
  const SUPABASE_KEY = "sb_publishable_6fFL45IwDGxTmdZKc698qw_mD4LUhpk";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ---------- Helpers ---------- */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const icon = (n, c = "w-4 h-4") => `<i data-lucide="${n}" class="${c}" aria-hidden="true"></i>`;
  const refreshIcons = () => window.lucide && window.lucide.createIcons();
  const firstName = (n) => (n || "").split(" ")[0];
  const pad = (x) => String(x).padStart(2, "0");
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const reducedMotion = !!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

  // Mirrors public.contains_money in the database, so people are warned
  // as they type instead of being rejected after they press send.
  const MONEY = (() => {
    // Mirrors public.contains_money in the database: strip the phrases that
    // state the rule ("no money", "this ride is free") before looking for
    // anything to block, so saying the right thing is never punished.
    const CLEAR = new RegExp(
      "\\b(no|zero|without|never|nobody|no one|none|dont|don't|do not|doesn't|does not|won't|will not|not)\\b"
      + "(\\s+\\w+){0,3}?\\s*\\b(money|monies|cash|payment|payments|paying|pay|pays|paid|charge|charges|cost|costs|fee|fees|price|prices)\\b"
      + "|\\b(free of charge|for free|totally free|completely free|no charge|at no cost|costs nothing|free ride|rides are free|ride is free|this ride is free|always free)\\b"
      + "|\\b(money|payment|cash)\\s+(is|are)\\s+not\\b", "gi");
    const HIT = new RegExp(
      "(€|\\$|£|\\beuros?\\b|\\beuron?\\b|\\bdollars?\\b|\\bpounds?\\b|\\bcents?\\b|\\bkr\\b|\\bkronor\\b|\\blira\\b"
      + "|\\bmoney\\b|\\bmonies\\b|\\bcash\\b|\\bfunds?\\b"
      + "|\\bpay\\w*|\\bpaid\\b|\\brepay\\w*|\\bprepay\\w*"
      + "|\\bcosts?\\b|\\bcosting\\b|\\bcharges?\\b|\\bcharged\\b|\\bcharging\\b"
      + "|\\bfees?\\b|\\bprices?\\b|\\bpricing\\b|\\brates?\\b|\\btolls?\\b|\\bbills?\\b|\\bexpenses?\\b|\\bfares?\\b"
      + "|\\bhow much\\b|\\bhur mycket\\b"
      + "|\\bchip in\\b|\\bchips in\\b|\\bcontribut\\w*|\\bsplit the\\b|\\bgo halves\\b|\\bhalf the\\b|\\bshare the (cost|fuel|petrol|gas|fare)\\b"
      + "|\\b(fuel|petrol|gas|diesel|benzin|bensin)\\s*(money|cost|costs|cash|contribution|share)\\b"
      + "|\\b(money|cash|something|anything)\\s+(for|towards|toward)\\s+(the\\s+)?(fuel|petrol|gas|diesel|ride|trip|drive|lift)\\b"
      + "|\\brevolut\\b|\\bpaypal\\b|\\bswish\\w*|\\bvenmo\\b|\\bzelle\\b|\\bwise\\b|\\bbank transfer\\b|\\biban\\b|\\bcrypto\\b|\\bbitcoin\\b"
      + "|\\btip\\s+(you|him|her|them|the driver)\\b|\\bcompensat\\w*|\\breimburs\\w*|\\brefund\\w*|\\bdonation\\w*|\\bdonate\\w*"
      + "|ευρώ|ευρω|λεφτά|λεφτα|χρήματα|χρηματα|πληρ|μετρητ)", "i");
    return { test: (t) => HIT.test(String(t || "").replace(CLEAR, " ")) };
  })();
  const LINK  = /(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|cy|se|eu|io|ly|me|app|info|link)\b)/i;

  const VIBES = [
    { id: "chatty",    label: "Chatty",        emoji: "🗣️" },
    { id: "quiet",     label: "Quiet & calm",  emoji: "🤫" },
    { id: "podcast",   label: "Podcast",       emoji: "🎧" },
    { id: "smokefree", label: "Smoke-free",    emoji: "🚭" },
    { id: "music",     label: "Music on",      emoji: "🎶" },
    { id: "pets",      label: "Pets welcome",  emoji: "🐾" },
    { id: "luggage",   label: "Room for bags", emoji: "🧳" },
  ];
  const vibeById = Object.fromEntries(VIBES.map((v) => [v.id, v]));

  const LEVELS = {
    email:  { label: "Email verified", icon: "mail" },
    google: { label: "Email verified", icon: "badge-check" },
    phone:  { label: "Phone verified", icon: "phone" },
    id:     { label: "ID verified",    icon: "shield-check" },
  };

  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const localISO = (d) => `${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

  function formatDay(iso) {
    const d = new Date(iso), today = new Date();
    const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);
    if (dayKey(d) === dayKey(today)) return "Today";
    if (dayKey(d) === dayKey(tomorrow)) return "Tomorrow";
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }
  const formatTime = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const fmtDuration = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ""}`);
  const arrivalTime = (iso, mins) => formatTime(new Date(new Date(iso).getTime() + mins * 60000));

  // Most of what gets sent on a trip is one of these. Tap, don't type.
  const QUICK = [
    "I'm on my way",
    "I'm at the pickup spot",
    "Running about 5 minutes late",
    "I'm here, where are you?",
    "See you tomorrow",
  ];

  const REPORT_REASONS = [
    ["money", "Asked for money"],
    ["no_show", "Didn't show up"],
    ["pickup_changed", "Changed the agreed pickup"],
    ["unsafe", "Unsafe driving or behaviour"],
    ["harassment", "Harassment"],
    ["parcel", "Asked me to carry something"],
    ["other", "Something else"],
  ];

  /* ---------- State ---------- */
  // Every column the browser is allowed to read from profiles. email_hash is
  // deliberately absent: it is the rejoin fingerprint, and only the database's
  // own functions may touch it. Asking for "*" would be refused outright.
  const PROFILE_COLS = "id, full_name, bio, avatar_url, verification_level, phone_verified_at, invited_by, can_invite, invites_left, role, status, created_at";

  const state = {
    view: "find",
    user: null, profile: null,
    cities: [], rides: [], myRequests: [], invites: [], chats: [], messages: [],
    myReviews: [], myRatings: { driver: null, passenger: null },
    // Ratings and reviews for anyone whose name appears in a decision the
    // user has to make, keyed by profile id.
    people: {},
    showAllReviews: {},
    shared: null,      // a trip someone shared with us, via ?t=
    shareLinks: {},    // chat id -> link we created
    admin: { reports: [], members: [], words: [], blocks: [], usage: null, people: {}, readingChat: null, chatMessages: [] },
    filters: { from: "", to: "", when: "any", vibes: [] },
    form: null,
    formErrors: {},
    modal: null,
    confirmDelete: null,
    loading: true,
    busy: false,
    heroPlayed: false,
  };

  const emptyForm = () => {
    const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0);
    return { from: "", to: "", departs: localISO(d), seats: 3, vibes: ["smokefree"], points: [""], note: "", pledge: false };
  };
  state.form = emptyForm();

  const rideById = (id) => state.rides.find((r) => r.id === id);
  const requestFor = (rideId) => state.myRequests.find((q) => q.ride_id === rideId);
  const chatById = (id) => state.chats.find((c) => c.id === id);
  const chatForRide = (rideId) => state.chats.find((c) => c.ride_id === rideId && !c.closed_at);

  // Who am I talking to in this chat?
  const otherPerson = (c) => (c.driver_id === state.user.id ? c.passenger : c.driver);
  const iAmDriver = (c) => c.driver_id === state.user.id;
  const hasReviewed = (c) => (iAmDriver(c) ? c.driver_reviewed_at : c.passenger_reviewed_at);
  const tripDone = (c) => new Date(c.departs_at).getTime() < Date.now();
  const daysLeft = (c) => Math.max(0, Math.ceil((new Date(c.delete_at) - Date.now()) / 86400000));

  // Messages button, with a count when something is waiting to be read.
  function messagesButton(c, extra = "") {
    const n = unreadIn(c);
    return `<button data-action="open-messages" data-id="${c.id}" class="btn-ghost py-2 ${extra}">
      ${icon("message-circle")} Messages
      ${n ? `<span class="ml-1 h-5 min-w-5 px-1.5 rounded-full bg-sun text-ink text-xs font-bold grid place-items-center">${n}</span>` : ""}
    </button>`;
  }

  // Unread tracking. The last message id you have seen per chat is kept in
  // this browser only, so it never becomes data Lifta has to store about you.
  const SEEN_KEY = "lifta-seen";
  const readSeen = () => { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch { return {}; } };
  const writeSeen = (o) => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(o)); } catch {} };
  const markSeen = (chatId, lastId) => { const s = readSeen(); s[chatId] = lastId; writeSeen(s); };
  const unreadIn = (c) => {
    const seen = readSeen()[c.id] || 0;
    return (c.messages || []).filter((m) => m.id > seen && m.sender_id && m.sender_id !== state.user.id).length;
  };
  const unreadTotal = () => state.chats.reduce((n, c) => n + unreadIn(c), 0);

  /* ---------- Notices ---------- */
  function toast(text, tone = "ok") {
    const el = document.createElement("div");
    el.className = `pop flex items-start gap-3 rounded-xl px-4 py-3 text-sm font-medium shadow-lg ${tone === "error" ? "bg-rose-700 text-white" : "bg-ink text-white"}`;
    el.innerHTML = `${icon(tone === "error" ? "triangle-alert" : "circle-check", "w-5 h-5 shrink-0")}<span>${esc(text)}</span>`;
    $("#toasts").appendChild(el);
    refreshIcons();
    setTimeout(() => el.remove(), 5000);
  }

  /* ---------- Building blocks ---------- */
  const TONES = ["bg-teal-100 text-teal-800","bg-amber-100 text-amber-900","bg-sky-100 text-sky-800","bg-rose-100 text-rose-800","bg-lime-100 text-lime-800"];
  function avatar(name, size = "md") {
    const tone = TONES[[...(name || "?")].reduce((s, c) => s + c.charCodeAt(0), 0) % TONES.length];
    const initials = (name || "?").split(" ").map((p) => p[0]).slice(0, 2).join("");
    const sizes = { sm: "w-9 h-9 text-sm", md: "w-11 h-11 text-base", lg: "w-20 h-20 text-2xl" };
    return `<div aria-hidden="true" class="${sizes[size]} ${tone} rounded-full grid place-items-center font-display font-extrabold shrink-0">${esc(initials)}</div>`;
  }

  function verifiedBadge(level) {
    const l = LEVELS[level] || LEVELS.email;
    return `<span class="inline-flex items-center gap-1 text-xs font-semibold text-teal-800 bg-teal-50 rounded-full px-2 py-0.5" title="${l.label}">
      ${icon(l.icon, "w-3.5 h-3.5")}${l.label}</span>`;
  }

  function rating(stats) {
    if (!stats || !stats.review_count) return `<span class="text-sm text-slate-500">No reviews yet</span>`;
    return `<span class="inline-flex items-center gap-1 text-sm">
      ${icon("star", "w-4 h-4 fill-amber-400 text-amber-400")}
      <span class="font-semibold">${Number(stats.avg_rating).toFixed(1)}</span>
      <span class="text-slate-500">(${stats.review_count})</span></span>`;
  }

  const vibeTag = (id) => (vibeById[id] ? `<span class="tag"><span aria-hidden="true">${vibeById[id].emoji}</span>${vibeById[id].label}</span>` : "");

  function seatDots(total, left) {
    const dots = Array.from({ length: total }, (_, i) => `<span class="w-3 h-3 rounded ${i < left ? "bg-teal-600" : "bg-slate-300"}"></span>`).join("");
    return `<div class="flex items-center gap-2"><div class="flex gap-1" aria-hidden="true">${dots}</div>
      <span class="text-sm text-slate-600">${left === 0 ? "Full" : `${plural(left, "seat", "seats")} left`}</span></div>`;
  }

  // The signature element: departure dot, dashed road, destination pin.
  function routeRibbon(r) {
    return `<div class="flex gap-3">
      <div class="flex flex-col items-center pt-1.5 pb-1" aria-hidden="true">
        <span class="w-3.5 h-3.5 rounded-full border-4 border-teal-600 bg-white"></span>
        <span class="road-v flex-1 my-1.5"></span>
        ${icon("map-pin", "w-5 h-5 text-ink fill-sun")}
      </div>
      <div class="flex-1 flex flex-col justify-between gap-3 min-w-0">
        <div>
          <p class="font-display text-xl font-extrabold leading-tight truncate">${esc(r.from_city)}</p>
          <p class="text-sm text-slate-500">Leaves ${formatTime(r.departs_at)}</p>
        </div>
        <p class="text-xs text-slate-500">About ${fmtDuration(r.est_minutes)}</p>
        <div>
          <p class="font-display text-xl font-extrabold leading-tight truncate">${esc(r.to_city)}</p>
          <p class="text-sm text-slate-500">Arrives around ${arrivalTime(r.departs_at, r.est_minutes)}</p>
        </div>
      </div>
    </div>`;
  }

  const routeInline = (from, to) => `<p class="flex items-center gap-2 font-display text-lg font-extrabold leading-tight">
    <span class="truncate">${esc(from)}</span><span class="road-h-sm" aria-label="to"></span><span class="truncate">${esc(to)}</span></p>`;

  function citySelect(id, value, attrs = "") {
    return `<select id="${id}" ${attrs} class="inp appearance-none">
      <option value="">Any town</option>
      ${state.cities.map((c) => `<option value="${esc(c.name)}" ${c.name === value ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
    </select>`;
  }

  function stepper(target, value, min, max) {
    return `<div class="inline-flex items-center rounded-full border border-slate-300 bg-white" role="group" aria-label="Seats" data-min="${min}" data-max="${max}">
      <button type="button" data-action="step" data-target="${target}" data-delta="-1" ${value <= min ? "disabled" : ""}
        class="w-9 h-9 grid place-items-center rounded-full hover:bg-slate-100 disabled:opacity-30" aria-label="Fewer seats">${icon("minus")}</button>
      <span class="w-6 text-center font-semibold tabular-nums" aria-live="polite">${value}</span>
      <button type="button" data-action="step" data-target="${target}" data-delta="1" ${value >= max ? "disabled" : ""}
        class="w-9 h-9 grid place-items-center rounded-full hover:bg-slate-100 disabled:opacity-30" aria-label="More seats">${icon("plus")}</button>
    </div>`;
  }

  const noMoneyNote = () => `<div class="flex gap-3 rounded-xl bg-amber-50 border border-amber-200 p-3 text-sm text-amber-900">
    ${icon("ban", "w-5 h-5 shrink-0 mt-0.5")}
    <p>No money on Lifta. Don't offer fuel money and don't accept it. If anyone asks you to pay, report them from their profile.</p></div>`;

  /* ---------- Ride card ---------- */
  function rideCard(r) {
    const d = r.driver || {};
    const mine = r.driver_id === state.user.id;
    const q = requestFor(r.id);

    let action;
    if (mine) {
      action = state.confirmDelete === r.id
        ? `<div class="flex items-center gap-2 text-sm">
             <span class="font-semibold">Cancel this ride?</span>
             <button data-action="delete-ride" data-id="${r.id}" class="rounded-full bg-rose-700 text-white px-3 py-1.5 font-semibold">Yes, cancel</button>
             <button data-action="cancel-delete" class="rounded-full border border-slate-300 px-3 py-1.5 font-semibold">Keep it</button>
           </div>`
        : `<div class="flex items-center gap-1">
             <span class="pill bg-slate-100 text-slate-700">Your ride</span>
             <button data-action="ask-delete" data-id="${r.id}" class="w-9 h-9 grid place-items-center rounded-full text-rose-700 hover:bg-rose-50" aria-label="Cancel this ride">${icon("trash-2")}</button>
           </div>`;
    } else if (q && q.status === "pending") {
      action = `<div class="flex items-center gap-3">
        <button data-action="withdraw" data-id="${q.id}" class="text-sm font-semibold text-rose-700 underline underline-offset-4">Withdraw</button>
        <span class="pill bg-amber-100 text-amber-900">${icon("hourglass")} Request sent</span></div>`;
    } else if (q && q.status === "accepted") {
      const c = chatForRide(r.id);
      action = `<div class="flex items-center gap-2 flex-wrap">
        <span class="pill bg-teal-100 text-teal-900">${icon("circle-check")} You're in</span>
        ${c ? messagesButton(c) : ""}</div>`;
    } else if (r.seats_left === 0) {
      action = `<span class="pill bg-slate-100 text-slate-500">Full</span>`;
    } else {
      action = `<button data-action="open-join" data-id="${r.id}" class="btn-primary">Request to join</button>`;
    }

    return `<article class="card p-5 flex flex-col gap-4">
      <header class="flex items-start justify-between gap-3">
        <button type="button" data-action="open-profile" data-id="${r.driver_id}" class="flex items-center gap-3 text-left rounded-lg min-w-0 group">
          ${avatar(d.full_name)}
          <div class="min-w-0">
            <p class="font-semibold leading-tight truncate group-hover:underline">${esc(d.full_name || "Member")}</p>
            <div class="flex items-center gap-2 mt-1 flex-wrap">${rating(r.driverRating)}${verifiedBadge(d.verification_level)}</div>
          </div>
        </button>
        <div class="text-right shrink-0">
          <p class="text-sm font-semibold">${formatDay(r.departs_at)}</p>
          <p class="text-sm text-slate-500">${formatTime(r.departs_at)}</p>
        </div>
      </header>

      ${routeRibbon(r)}

      ${r.note ? `<p class="text-sm text-slate-600 leading-relaxed">${esc(r.note)}</p>` : ""}
      ${r.vibes?.length ? `<div class="flex flex-wrap gap-1.5">${r.vibes.map(vibeTag).join("")}</div>` : ""}

      <p class="flex items-start gap-2 text-sm text-slate-600">
        ${icon("map-pin", "w-4 h-4 shrink-0 mt-0.5 text-slate-400")}
        <span>${q && q.status === "accepted"
          ? `Meeting at <span class="font-semibold">${esc(q.pickup)}</span>`
          : `${plural(r.meeting_points.length, "meeting point", "meeting points")} in ${esc(r.from_city)}`}</span></p>

      <footer class="flex items-center justify-between gap-3 pt-4 border-t border-slate-100 mt-auto flex-wrap">
        ${seatDots(r.seats_total, r.seats_left)}
        ${action}
      </footer>
    </article>`;
  }

  /* ---------- View: Find a ride ---------- */
  function findView() {
    const f = state.filters;
    const whens = [["any","Any day"],["today","Today"],["tomorrow","Tomorrow"],["week","Next 7 days"]];
    return `
    <section class="bg-ink text-white relative overflow-hidden">
      <div class="max-w-6xl mx-auto px-4 pt-10 pb-12 sm:pt-14 sm:pb-14">
        <h1 class="font-display text-4xl sm:text-6xl font-extrabold leading-none tracking-tight max-w-2xl">Going somewhere? Take someone along.</h1>
        <p class="mt-5 max-w-lg text-lg text-slate-300 leading-relaxed">Drivers with empty seats meet people heading the same way. Nobody pays. Everybody gets company.</p>
      </div>
      <div class="road-hero relative" aria-hidden="true">${icon("car", `hero-car w-8 h-8 text-sun ${state.heroPlayed ? "parked" : ""}`)}</div>
    </section>

    <div class="max-w-6xl mx-auto px-4 py-6 sm:py-8">
      <div class="card p-4 grid gap-3 md:grid-cols-12 md:items-end">
        <div class="md:col-span-4">
          <label for="q-from" class="label">From</label>
          ${citySelect("q-from", f.from, 'data-filter="from"')}
        </div>
        <div class="md:col-span-1 flex justify-center md:pb-1">
          <button type="button" data-action="swap" class="w-10 h-10 grid place-items-center rounded-full border border-slate-300 hover:bg-slate-100" aria-label="Swap from and to">
            ${icon("arrow-up-down", "w-4 h-4 md:rotate-90")}</button>
        </div>
        <div class="md:col-span-4">
          <label for="q-to" class="label">To</label>
          ${citySelect("q-to", f.to, 'data-filter="to"')}
        </div>
        <div class="md:col-span-3">
          <label for="q-when" class="label">When</label>
          <select id="q-when" data-filter="when" class="inp appearance-none">
            ${whens.map(([v, l]) => `<option value="${v}" ${f.when === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
        </div>
      </div>

      <div id="vibe-filters" class="mt-4 flex flex-wrap gap-2" role="group" aria-label="Filter by vibe">${vibeChips()}</div>

      <div class="mt-8 flex items-baseline justify-between gap-4">
        <h2 id="results-title" class="font-display text-2xl font-extrabold"></h2>
        <button id="clear-filters" data-action="clear-filters" class="hidden text-sm font-semibold text-teal-800 underline underline-offset-4">Clear filters</button>
      </div>
      <div id="results" class="mt-4"></div>
    </div>`;
  }

  const vibeChips = () => VIBES.map((v) => {
    const on = state.filters.vibes.includes(v.id);
    return `<button type="button" data-action="filter-vibe" data-id="${v.id}" aria-pressed="${on}" class="chip ${on ? "chip-on" : "chip-off"}">
      <span aria-hidden="true">${v.emoji}</span>${v.label}</button>`;
  }).join("");

  function filteredRides() {
    const f = state.filters;
    const now = new Date();
    const end = new Date(); end.setDate(now.getDate() + 7);
    const tomorrow = new Date(); tomorrow.setDate(now.getDate() + 1);
    return state.rides.filter((r) => {
      if (f.from && r.from_city !== f.from) return false;
      if (f.to && r.to_city !== f.to) return false;
      const d = new Date(r.departs_at);
      if (f.when === "today" && dayKey(d) !== dayKey(now)) return false;
      if (f.when === "tomorrow" && dayKey(d) !== dayKey(tomorrow)) return false;
      if (f.when === "week" && d > end) return false;
      if (f.vibes.length && !f.vibes.every((v) => r.vibes.includes(v))) return false;
      return true;
    });
  }

  const hasFilters = () => {
    const f = state.filters;
    return !!(f.from || f.to || f.when !== "any" || f.vibes.length);
  };

  function renderResults() {
    const box = $("#results");
    if (!box) return;
    const list = filteredRides();
    $("#results-title").textContent = state.loading ? "Loading rides…" : plural(list.length, "ride", "rides");
    $("#clear-filters").classList.toggle("hidden", !hasFilters());

    box.innerHTML = state.loading
      ? `<div class="py-12 text-center text-slate-500">${icon("loader-circle", "spin w-6 h-6 mx-auto")}</div>`
      : list.length
        ? `<div class="grid gap-4 lg:grid-cols-2">${list.map(rideCard).join("")}</div>`
        : `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center">
            ${icon("car", "w-10 h-10 mx-auto text-slate-400")}
            <p class="mt-3 font-semibold text-lg">${state.rides.length ? "No rides match these filters." : "No rides posted yet."}</p>
            <p class="mt-1 text-slate-600">${state.rides.length ? "Try another day or fewer vibe tags." : "Be the first. Post a trip you're already making."}</p>
            <button data-action="nav" data-view="post" class="btn-primary mt-5">Post a ride</button>
          </div>`;
    refreshIcons();
  }

  /* ---------- View: Post a ride ---------- */
  function postView() {
    const f = state.form, e = state.formErrors;
    const err = (k) => e[k] ? `<p class="mt-1.5 text-sm text-rose-700" role="alert">${esc(e[k])}</p>` : "";

    return `
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12">
      <h1 class="font-display text-4xl sm:text-5xl font-extrabold tracking-tight">Post a ride</h1>
      <p class="mt-3 max-w-xl text-lg text-slate-600">Tell people where you're headed and what the ride is like. They'll ask to join, and you choose who comes.</p>

      <form id="ride-form" novalidate class="card mt-8 p-5 sm:p-6 space-y-6">
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="f-from" class="label">Leaving from</label>
            <select id="f-from" data-field="from" class="inp appearance-none ${e.from ? "inp-error" : ""}">
              <option value="">Choose a town</option>
              ${state.cities.map((c) => `<option value="${esc(c.name)}" ${c.name === f.from ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
            </select>${err("from")}
          </div>
          <div>
            <label for="f-to" class="label">Going to</label>
            <select id="f-to" data-field="to" class="inp appearance-none ${e.to ? "inp-error" : ""}">
              <option value="">Choose a town</option>
              ${state.cities.map((c) => `<option value="${esc(c.name)}" ${c.name === f.to ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
            </select>${err("to")}
          </div>
        </div>
        <p class="text-sm text-slate-500 -mt-2">Heading somewhere just outside a town on the list? Pick the nearest one and say the rest in your meeting point or note.</p>

        <div>
          <label for="f-departs" class="label">Departure</label>
          <input id="f-departs" type="datetime-local" data-field="departs" value="${esc(f.departs)}" class="inp ${e.departs ? "inp-error" : ""}" />
          ${err("departs")}
        </div>

        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-semibold text-slate-700">Free seats</p>
            <p class="text-sm text-slate-500">Count only seats with a seatbelt.</p>
          </div>
          ${stepper("form", f.seats, 1, 4)}
        </div>

        <fieldset>
          <legend class="text-sm font-semibold text-slate-700 mb-2">What's the ride like?</legend>
          <div id="form-vibes" class="grid grid-cols-2 sm:grid-cols-3 gap-2">${formVibes()}</div>
        </fieldset>

        <div>
          <label class="label">Meeting points</label>
          <p class="text-sm text-slate-500 mb-2">Public places only, like a square, a marina or a petrol station. Never your home address.</p>
          <p class="text-sm text-slate-500 mb-2">A meeting point covers an area about 200 metres across, so name something specific rather than a whole neighbourhood. You and your passenger both wait inside that area.</p>
          <div id="points">${f.points.map((p, i) => pointRow(p, i)).join("")}</div>
          ${err("points")}
          ${f.points.length < 5 ? `<button type="button" data-action="add-point" class="btn-ghost mt-2 py-2 text-sm">${icon("plus")} Add another</button>` : ""}
        </div>

        <div>
          <label for="f-note" class="label">A note for passengers</label>
          <textarea id="f-note" data-field="note" rows="4" maxlength="280" class="inp resize-none ${e.note ? "inp-error" : ""}"
            placeholder="Heading to work. Happy to drop you anywhere near the ring road.">${esc(f.note)}</textarea>
          <p id="note-help" class="mt-1.5 text-sm ${e.note ? "text-rose-700" : "text-slate-500"}">${noteHelp()}</p>
        </div>

        <div>
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" data-field="pledge" ${f.pledge ? "checked" : ""} class="mt-1 w-5 h-5 rounded border-slate-400 accent-teal-700" />
            <span class="text-slate-700">I'm sharing this ride for free. I won't ask for or accept money, fuel costs or favours in return.</span>
          </label>${err("pledge")}
        </div>

        <button type="submit" class="btn-primary w-full sm:w-auto px-6 py-3 text-base" ${state.busy ? "disabled" : ""}>Post ride</button>
      </form>
    </div>`;
  }

  const pointRow = (value, i) => `<div class="flex gap-2 mb-2">
    <input data-point="${i}" value="${esc(value)}" maxlength="80" class="inp" placeholder="${i === 0 ? "Finikoudes promenade" : "Another spot on the way"}" />
    ${i > 0 ? `<button type="button" data-action="remove-point" data-id="${i}" class="w-11 h-11 shrink-0 grid place-items-center rounded-xl border border-slate-300 text-rose-700 hover:bg-rose-50" aria-label="Remove this meeting point">${icon("x")}</button>` : ""}
  </div>`;

  const formVibes = () => VIBES.map((v) => {
    const on = state.form.vibes.includes(v.id);
    return `<button type="button" data-action="form-vibe" data-id="${v.id}" aria-pressed="${on}"
      class="flex items-center gap-2 rounded-xl border px-3 py-2.5 text-sm font-medium text-left transition-colors ${on ? "border-teal-600 bg-teal-50 text-teal-900" : "border-slate-300 hover:border-slate-400"}">
      <span aria-hidden="true" class="text-base">${v.emoji}</span><span class="flex-1">${v.label}</span>${on ? icon("check", "w-4 h-4 text-teal-700") : ""}</button>`;
  }).join("");

  function noteHelp() {
    const n = state.form.note;
    if (MONEY.test(n)) return "Remove anything about money. Lifta rides are free.";
    if (LINK.test(n)) return "Links are not allowed.";
    return `${n.length}/280. Pickup details, stops on the way, anything useful.`;
  }

  function validateForm() {
    const f = state.form, e = {};
    if (!f.from) e.from = "Choose where you're leaving from.";
    if (!f.to) e.to = "Choose where you're going.";
    else if (f.from === f.to) e.to = "Pick a destination different from the departure.";
    if (!f.departs) e.departs = "Pick a date and time.";
    else if (new Date(f.departs).getTime() <= Date.now() + 10 * 60000) e.departs = "Departure has to be at least 10 minutes from now.";
    const pts = f.points.map((p) => p.trim()).filter(Boolean);
    if (!pts.length) e.points = "Add at least one meeting point.";
    else if (pts.some((p) => p.length < 3)) e.points = "Each meeting point needs at least 3 characters.";
    else if (pts.some((p) => MONEY.test(p) || LINK.test(p))) e.points = "Meeting points cannot mention money or contain links.";
    if (MONEY.test(f.note)) e.note = "Remove anything about money.";
    else if (LINK.test(f.note)) e.note = "Links are not allowed.";
    if (!f.pledge) e.pledge = "Confirm the ride is free to post it.";
    return e;
  }

  async function submitRide() {
    const errors = validateForm();
    state.formErrors = errors;
    if (Object.keys(errors).length) { render(); return; }

    const f = state.form;
    state.busy = true;
    const { error } = await db.from("rides").insert({
      driver_id: state.user.id,
      from_city: f.from,
      to_city: f.to,
      departs_at: new Date(f.departs).toISOString(),
      seats_total: f.seats,
      seats_left: f.seats,
      vibes: f.vibes,
      meeting_points: f.points.map((p) => p.trim()).filter(Boolean),
      note: f.note.trim(),
    });
    state.busy = false;
    if (error) return toast(error.message, "error");

    state.form = emptyForm();
    state.formErrors = {};
    state.filters = { from: "", to: "", when: "any", vibes: [] };
    state.view = "find";
    await loadRides();
    toast(`Ride posted. ${f.from} to ${f.to}.`);
  }

  /* ---------- View: My trips ---------- */
  function tripsView() {
    const driving = state.rides.filter((r) => r.driver_id === state.user.id);
    const riding = state.myRequests.map((q) => ({ ...q, ride: rideById(q.ride_id) })).filter((q) => q.ride);
    // A trip is "done" once it has departed. The ride row is gone by then;
    // the chat keeps its own frozen copy of the agreement.
    const past = state.chats.filter(tripDone).sort((a, b) => new Date(b.departs_at) - new Date(a.departs_at));

    return `
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12">
      <h1 class="font-display text-4xl sm:text-5xl font-extrabold tracking-tight mb-10">My trips</h1>

      <section>
        <h2 class="font-display text-2xl font-extrabold mb-4">You're driving</h2>
        ${driving.length ? `<div class="space-y-4">${driving.map(drivingCard).join("")}</div>` : emptyBox("You haven't posted a ride yet. Driving somewhere soon? Offer your empty seats.", "Post a ride", "post")}
      </section>

      <section class="mt-10">
        <h2 class="font-display text-2xl font-extrabold mb-4">You're riding</h2>
        ${riding.length ? `<div class="space-y-4">${riding.map(ridingCard).join("")}</div>` : emptyBox("No ride requests yet. Find someone heading your way.", "Find a ride", "find")}
      </section>

      ${past.length ? `<p class="mt-10 text-sm text-slate-600">
        ${plural(past.length, "finished trip", "finished trips")} in your
        <button data-action="nav" data-view="archive" class="font-semibold text-teal-800 underline underline-offset-4">archive</button>.</p>` : ""}
    </div>`;
  }

  /* ---------- View: Archive ----------
     Finished trips. The ride itself is gone; what is left is the agreement,
     the messages and the chance to leave a review, for 5 days after arrival.
     Private to the two people who were on the trip. Not visible to anyone
     else, and not to an admin unless the thread has been reported. */
  function archiveView() {
    const done = state.chats.filter(tripDone).sort((a, b) => new Date(b.departs_at) - new Date(a.departs_at));
    const needs = done.filter((c) => !hasReviewed(c) || unreadIn(c));
    const rest  = done.filter((c) => hasReviewed(c) && !unreadIn(c));

    return `
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12">
      <h1 class="font-display text-4xl sm:text-5xl font-extrabold tracking-tight">Archive</h1>
      <p class="mt-3 max-w-xl text-lg text-slate-600">Trips that have happened. The agreement and the messages stay for 5 days after arrival, then they are deleted. Only you and the other person can see any of this.</p>

      ${!done.length ? `<div class="mt-8 rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center">
          ${icon("archive", "w-10 h-10 mx-auto text-slate-400")}
          <p class="mt-3 font-semibold text-lg">Nothing here yet.</p>
          <p class="mt-1 text-slate-600">A trip lands here once it has departed.</p>
        </div>` : ""}

      ${needs.length ? `<section class="mt-8">
        <h2 class="font-display text-2xl font-extrabold mb-1">Needs you</h2>
        <p class="mb-4 text-sm text-slate-600">A review to leave, or something the other person wrote.</p>
        <ul class="card divide-y divide-slate-100">${needs.map(pastRow).join("")}</ul>
      </section>` : ""}

      ${rest.length ? `<section class="mt-8">
        <h2 class="font-display text-2xl font-extrabold mb-4">Nothing outstanding</h2>
        <ul class="card divide-y divide-slate-100">${rest.map(pastRow).join("")}</ul>
      </section>` : ""}

      ${done.length ? `<p class="mt-6 flex items-start gap-2 text-sm text-slate-500">
        ${icon("trash-2", "w-4 h-4 shrink-0 mt-0.5")}
        <span>Five days after a trip arrives, its agreement and messages are deleted for good. Reviews stay on the profile they are about.</span></p>` : ""}
    </div>`;
  }

  // Built from chats, not rides: the ride is deleted the moment it departs.
  function pastRow(c) {
    const other = otherPerson(c) || {};
    const reviewed = hasReviewed(c);
    return `<li class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="min-w-0">
        ${routeInline(c.from_city, c.to_city)}
        <p class="mt-1 text-sm text-slate-600">${formatDay(c.departs_at)} with ${esc(other.full_name || "a member")}</p>
        <p class="mt-1 flex items-center gap-1.5 text-xs text-slate-500">${icon("trash-2", "w-3.5 h-3.5")} Deleted in ${plural(daysLeft(c), "day", "days")}</p>
      </div>
      <div class="flex items-center gap-2 shrink-0 flex-wrap">
        <button data-action="open-messages" data-id="${c.id}" class="btn-ghost py-2">${icon("file-text")} Agreement
          ${unreadIn(c) ? `<span class="ml-1 h-5 min-w-5 px-1.5 rounded-full bg-sun text-ink text-xs font-bold grid place-items-center">${unreadIn(c)}</span>` : ""}
        </button>
        ${reviewed
          ? `<span class="text-sm text-slate-500">Reviewed</span>`
          : `<button data-action="open-review" data-id="${c.id}" class="btn-primary">${icon("star")} Review</button>`}
      </div>
    </li>`;
  }

  const emptyBox = (text, cta, view) => `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <p class="text-slate-600">${text}</p>
    <button data-action="nav" data-view="${view}" class="btn-primary shrink-0">${cta}</button></div>`;

  function drivingCard(r) {
    const pending = (r.requests || []).filter((i) => i.status === "pending");
    const accepted = (r.requests || []).filter((i) => i.status === "accepted");
    return `<div class="card p-5">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="min-w-0">
          ${routeInline(r.from_city, r.to_city)}
          <p class="mt-1 text-sm text-slate-600">${formatDay(r.departs_at)} at ${formatTime(r.departs_at)}. ${r.seats_left} of ${r.seats_total} seats open.</p>
        </div>
        ${state.confirmDelete === r.id
          ? `<div class="flex items-center gap-2 text-sm">
               <button data-action="delete-ride" data-id="${r.id}" class="rounded-full bg-rose-700 text-white px-3 py-1.5 font-semibold">Yes, cancel</button>
               <button data-action="cancel-delete" class="rounded-full border border-slate-300 px-3 py-1.5 font-semibold">Keep it</button></div>`
          : `<button data-action="ask-delete" data-id="${r.id}" class="inline-flex items-center gap-1.5 text-sm font-semibold text-rose-700 rounded-full px-3 py-2 hover:bg-rose-50">${icon("trash-2")} Cancel ride</button>`}
      </div>

      ${pending.map((q) => {
        const p = q.passenger || {};
        const rt = state.people[q.passenger_id] || {};
        return `<div class="pop mt-4 rounded-xl border border-amber-300 bg-amber-50 p-4">
          <div class="flex items-center gap-3">
            <button data-action="open-profile" data-id="${q.passenger_id}" class="rounded-full">${avatar(p.full_name, "sm")}</button>
            <div class="min-w-0">
              <p class="font-semibold leading-tight">${esc(p.full_name || "Member")} wants to join</p>
              <div class="flex items-center gap-2 mt-0.5 flex-wrap">${verifiedBadge(p.verification_level)}</div>
            </div>
          </div>

          <!-- This is where the driver decides who sits in their car, so what
               others have said about this person belongs right here. -->
          <div class="mt-3 rounded-xl bg-white border border-amber-200 p-3">
            <div class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm">
              <span class="text-slate-500">As a passenger: ${rating(rt.passenger)}</span>
              <span class="text-slate-500">As a driver: ${rating(rt.driver)}</span>
            </div>
            ${rt.reviews && rt.reviews.length
              ? `<ul class="mt-2 space-y-2 border-t border-slate-100 pt-2">${rt.reviews.slice(0, 2).map((r) => `
                  <li class="text-sm">
                    <span class="flex" aria-label="${r.rating} out of 5">${[1,2,3,4,5].map((s) =>
                      icon("star", `w-3 h-3 ${s <= r.rating ? "fill-amber-400 text-amber-400" : "text-slate-300"}`)).join("")}</span>
                    ${r.body ? `<p class="mt-0.5 text-slate-700">${esc(r.body)}</p>` : ""}
                    <p class="text-xs text-slate-500">${esc(r.authorName || "A former member")}, ${r.role === "driver" ? "as the driver" : "as a passenger"}</p>
                  </li>`).join("")}</ul>
                ${rt.reviews.length > 2 ? `<button data-action="open-profile" data-id="${q.passenger_id}" class="mt-2 text-sm font-semibold text-teal-800 underline underline-offset-4">Read all ${rt.reviews.length} reviews</button>` : ""}`
              : `<p class="mt-2 text-sm text-slate-500 border-t border-slate-100 pt-2">No reviews yet. Everyone starts somewhere.</p>`}
          </div>

          <p class="mt-3 flex gap-2 text-sm text-slate-700">${icon("map-pin", "w-4 h-4 shrink-0 mt-0.5 text-slate-500")} Pickup at ${esc(q.pickup)}</p>
          ${q.message ? `<p class="mt-2 flex gap-2 text-sm text-slate-700">${icon("message-circle", "w-4 h-4 shrink-0 mt-0.5 text-slate-500")}${esc(q.message)}</p>` : ""}
          <div class="mt-4 flex flex-wrap items-center gap-2">
            <button data-action="respond" data-id="${q.id}" data-accept="1" class="btn-primary" ${q.seats > r.seats_left ? "disabled" : ""}>Accept</button>
            <button data-action="respond" data-id="${q.id}" data-accept="0" class="btn-ghost">Decline</button>
            <span class="text-sm text-slate-600">${q.seats > r.seats_left ? "Not enough free seats left." : `Needs ${plural(q.seats, "seat", "seats")}`}</span>
          </div>
        </div>`;
      }).join("")}

      ${accepted.length ? `<div class="mt-4 pt-4 border-t border-slate-100">
        <p class="flex items-center gap-2 text-sm font-semibold text-teal-800">${icon("users")} Riding with you</p>
        <ul class="mt-2 space-y-2">${accepted.map((q) => {
          const c = state.chats.find((x) => x.request_id === q.id);
          return `<li class="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-3 py-2">
            <span class="flex items-center gap-2 min-w-0">${avatar(q.passenger?.full_name, "sm")}
              <span class="min-w-0"><span class="block font-medium truncate">${esc(q.passenger?.full_name || "Member")}</span>
              <span class="block text-sm text-slate-500 truncate">${esc(q.pickup)}</span></span></span>
            ${c ? messagesButton(c, "shrink-0") : ""}
          </li>`;
        }).join("")}</ul></div>` : ""}
      ${!pending.length && !accepted.length ? `<p class="mt-4 text-sm text-slate-500">No requests yet. They show up here as soon as someone asks to join.</p>` : ""}
    </div>`;
  }

  function ridingCard(q) {
    const r = q.ride, d = r.driver || {};
    const confirmed = q.status === "accepted";
    return `<div class="card p-5">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="min-w-0">
          ${routeInline(r.from_city, r.to_city)}
          <p class="mt-1 text-sm text-slate-600">${formatDay(r.departs_at)} at ${formatTime(r.departs_at)} with ${esc(d.full_name || "a member")}. ${plural(q.seats, "seat", "seats")}.</p>
        </div>
        ${confirmed
          ? `<span class="pill bg-teal-100 text-teal-900">${icon("circle-check")} Seat confirmed</span>`
          : `<span class="pill bg-amber-100 text-amber-900">${icon("hourglass")} Waiting for ${esc(firstName(d.full_name))}</span>`}
      </div>
      <p class="mt-3 flex gap-2 text-sm text-slate-600">${icon("map-pin", "w-4 h-4 shrink-0 mt-0.5")} Pickup at ${esc(q.pickup)}</p>
      <div class="mt-4 flex items-center gap-4 flex-wrap">
        ${confirmed && chatForRide(r.id) ? messagesButton(chatForRide(r.id)) : ""}
        <button data-action="withdraw" data-id="${q.id}" class="text-sm font-semibold text-rose-700 underline underline-offset-4">${confirmed ? "Leave this ride" : "Withdraw request"}</button>
      </div>
    </div>`;
  }

  /* ---------- View: Profile ---------- */
  function profileView() {
    const p = state.profile;
    const unused = state.invites.filter((i) => !i.used_by && new Date(i.expires_at) > new Date());
    return `
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12 space-y-6">
      <section class="card p-6">
        <div class="flex flex-col sm:flex-row sm:items-center gap-5">
          ${avatar(p.full_name, "lg")}
          <div class="min-w-0">
            <h1 class="font-display text-3xl font-extrabold tracking-tight">${esc(p.full_name)}</h1>
            <div class="mt-2 flex flex-wrap items-center gap-3">
              ${verifiedBadge(p.verification_level)}
              ${p.role === "admin" ? `<span class="tag">${icon("shield", "w-3.5 h-3.5")}Admin</span>` : ""}
            </div>
          </div>
        </div>

        <form id="bio-form" class="mt-6">
          <label for="p-bio" class="label">A little about you</label>
          <textarea id="p-bio" rows="3" maxlength="300" class="inp resize-none"
            placeholder="What you do, where you usually drive, what you like to talk about.">${esc(p.bio)}</textarea>
          <p id="bio-help" class="mt-1.5 text-sm text-slate-500">${p.bio.length}/300. No money or links.</p>
          <button type="submit" class="btn-ghost mt-3">Save</button>
        </form>

        <dl class="mt-6 grid grid-cols-2 gap-4 border-t border-slate-100 pt-5">
          <div><dt class="text-sm text-slate-500">Member since</dt>
            <dd class="mt-1 font-semibold">${new Date(p.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</dd></div>
          <div><dt class="text-sm text-slate-500">Invites left</dt>
            <dd class="mt-1 font-semibold">${p.role === "admin" ? "Unlimited" : p.invites_left}</dd></div>
        </dl>
      </section>

      <section class="card p-6">
        <h2 class="font-display text-xl font-extrabold">Your standing</h2>
        <p class="mt-1 text-sm text-slate-600">People rate you separately for driving and for riding along.</p>
        <div class="mt-4">${bothRatings(state.myRatings.driver, state.myRatings.passenger)}</div>
        <h3 class="mt-6 font-display text-lg font-extrabold">What people say about you</h3>
        ${reviewList(state.myReviews, "mine")}
      </section>

      <section class="card p-6">
        <h2 class="font-display text-xl font-extrabold">Invite someone</h2>
        <p class="mt-1 text-sm text-slate-600">You vouch for the people you invite. Only share with people you trust.</p>
        ${unused.length ? `<ul class="mt-4 space-y-2">${unused.map((i) => `
          <li class="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-4 py-3">
            <span class="font-mono font-semibold tracking-widest">${esc(i.code)}</span>
            <span class="text-sm text-slate-500">Valid until ${new Date(i.expires_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span>
          </li>`).join("")}</ul>` : `<p class="mt-4 text-sm text-slate-500">No unused codes right now.</p>`}
        <button data-action="invite" class="btn-ghost mt-4">${icon("plus")} Create a code</button>
      </section>

      <section class="rounded-2xl bg-ink text-white p-6">
        <h2 class="font-display text-xl font-extrabold flex items-center gap-2">${icon("shield-check", "w-5 h-5 text-sun")} How trust works on Lifta</h2>
        <ul class="mt-4 space-y-3 text-slate-200 leading-relaxed">
          <li class="flex gap-3">${icon("user-plus", "w-5 h-5 shrink-0 mt-0.5 text-teal-300")} Invite-only. Whoever brought you in vouches for you.</li>
          <li class="flex gap-3">${icon("user", "w-5 h-5 shrink-0 mt-0.5 text-teal-300")} Real names. You always know who you're riding with.</li>
          <li class="flex gap-3">${icon("map-pin", "w-5 h-5 shrink-0 mt-0.5 text-teal-300")} Public meeting points only. The exact spot shows once your seat is confirmed.</li>
          <li class="flex gap-3">${icon("trash-2", "w-5 h-5 shrink-0 mt-0.5 text-teal-300")} A ride is deleted the moment it departs. We keep nothing we don't need.</li>
          <li class="flex gap-3">${icon("ban", "w-5 h-5 shrink-0 mt-0.5 text-teal-300")} No money, ever. Asking for payment gets an account removed.</li>
        </ul>
      </section>

      <section class="card p-6">
        <h2 class="font-display text-xl font-extrabold">Your account</h2>
        <p class="mt-1 text-sm text-slate-600">${esc(state.user.email)}</p>
        <div class="mt-4 flex flex-wrap gap-4">
          <button data-action="nav" data-view="legal" class="text-sm font-semibold text-slate-600 underline underline-offset-4">About, terms and privacy</button>
          <button data-action="signout" class="text-sm font-semibold text-slate-600 underline underline-offset-4">Sign out</button>
          <button data-action="delete-account" class="text-sm font-semibold text-rose-700 underline underline-offset-4">Delete my account and all my data</button>
        </div>
      </section>
    </div>`;
  }

  /* ---------- View: Admin ----------
     Only for admins, and deliberately narrow. Reported threads can be
     read; everything else stays private. Every read is written to the
     audit log by the database, not by this page. */
  function adminView() {
    const a = state.admin;
    const open = a.reports.filter((r) => r.status === "open");
    const closed = a.reports.filter((r) => r.status === "closed").slice(0, 10);
    const reasonLabel = (id) => (REPORT_REASONS.find(([x]) => x === id) || [, id])[1];

    const reportRow = (r) => {
      const reporter = a.people[r.reporter_id];
      const reported = a.people[r.reported_id];
      const openRow = r.status === "open";
      return `<li class="p-5">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="font-semibold">${esc(reasonLabel(r.reason))}</p>
            <p class="mt-1 text-sm text-slate-600">
              ${esc(reported?.full_name || "Unknown")} reported by ${esc(reporter?.full_name || "a former member")}
              on ${new Date(r.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</p>
            ${r.details ? `<p class="mt-2 text-sm text-slate-700 rounded-xl bg-slate-50 p-3">${esc(r.details)}</p>` : ""}
          </div>
          ${openRow
            ? `<span class="pill bg-amber-100 text-amber-900 shrink-0">${icon("circle-alert")} Open</span>`
            : `<span class="pill bg-slate-100 text-slate-600 shrink-0">Closed</span>`}
        </div>

        ${openRow ? `<div class="mt-4 flex flex-wrap gap-2">
          ${r.chat_id ? `<button data-action="admin-read" data-id="${r.chat_id}" class="btn-ghost py-2">${icon("file-text")} Read the thread</button>` : ""}
          ${reported ? `<button data-action="admin-suspend" data-id="${r.reported_id}" class="btn-ghost py-2 text-rose-700 border-rose-300">${icon("user-x")} Suspend ${esc(firstName(reported.full_name))}</button>` : ""}
          <button data-action="admin-close" data-id="${r.id}" class="btn-primary py-2">${icon("check")} Close this case</button>
        </div>
        <p class="mt-2 text-xs text-slate-500">Reading a thread is logged. A reported thread is kept until the case is closed, then 90 more days.</p>` : ""}

        ${a.readingChat === r.chat_id && a.chatMessages.length ? `<div class="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4 space-y-2 max-h-64 overflow-y-auto">
          ${a.chatMessages.map((msg) => `<p class="text-sm ${msg.sender_id ? "" : "text-slate-500 italic"}">
            <span class="font-semibold">${msg.sender_id ? esc(a.people[msg.sender_id]?.full_name || "Member") : "Lifta"}:</span>
            ${esc(msg.body)}</p>`).join("")}
        </div>` : ""}
      </li>`;
    };

    const memberRow = (p) => `<li class="p-4 flex flex-wrap items-center justify-between gap-3">
      <span class="flex items-center gap-3 min-w-0">
        ${avatar(p.full_name, "sm")}
        <span class="min-w-0">
          <span class="block font-medium truncate">${esc(p.full_name)}${p.role === "admin" ? ' <span class="tag ml-1">Admin</span>' : ""}</span>
          <span class="block text-sm text-slate-500">Joined ${new Date(p.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}${p.invited_by ? `, invited by ${esc(firstName(a.people[p.invited_by]?.full_name) || "a member")}` : ""}</span>
        </span>
      </span>
      ${p.id === state.user.id ? `<span class="text-sm text-slate-500 shrink-0">You</span>`
        : p.status === "suspended"
          ? `<button data-action="admin-restore" data-id="${p.id}" class="btn-ghost py-2 shrink-0">Restore</button>`
          : `<button data-action="admin-suspend" data-id="${p.id}" class="btn-ghost py-2 text-rose-700 border-rose-300 shrink-0">Suspend</button>`}
    </li>`;

    return `
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12 space-y-6">
      <div>
        <h1 class="font-display text-4xl sm:text-5xl font-extrabold tracking-tight">Admin</h1>
        <p class="mt-3 text-lg text-slate-600">Reports first. Everything else is housekeeping.</p>
      </div>

      ${a.usage ? `<section class="card p-5">
        <h2 class="font-display text-xl font-extrabold">Is it being used?</h2>
        <p class="mt-1 text-sm text-slate-600">Counts only. No names, no routes, no record of who rode with whom.</p>
        <dl class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-4">
          ${[["Members", a.usage.members],
             ["Rides coming up", a.usage.rides_upcoming],
             ["Seats offered", a.usage.seats_offered],
             ["Trips shared, last 5 days", a.usage.trips_shared_recent],
             ["Seats booked ahead", a.usage.trips_booked_ahead],
             ["Requests waiting", a.usage.requests_pending],
             ["Reviews written", a.usage.reviews_total],
             ["Open reports", a.usage.reports_open],
             ["Active blocks", a.usage.blocks_active]].map(([label, n]) => `
            <div><dt class="text-sm text-slate-500">${label}</dt>
              <dd class="mt-0.5 font-display text-2xl font-extrabold">${n}</dd></div>`).join("")}
        </dl>
        <p class="mt-4 text-sm text-slate-500">Trips shared covers the last five days, because that is how long a trip exists before it deletes itself. Nothing is kept in order to produce these numbers.</p>
      </section>` : ""}

      <section class="card">
        <div class="p-5 pb-0 flex items-center justify-between gap-3">
          <h2 class="font-display text-xl font-extrabold">Open reports</h2>
          ${open.length ? `<span class="pill bg-amber-100 text-amber-900">${open.length}</span>` : ""}
        </div>
        ${open.length
          ? `<ul class="divide-y divide-slate-100 mt-2">${open.map(reportRow).join("")}</ul>`
          : `<p class="p-5 text-slate-600">Nothing to look at. Good sign.</p>`}
      </section>

      ${closed.length ? `<section class="card">
        <h2 class="font-display text-xl font-extrabold p-5 pb-0">Recently closed</h2>
        <ul class="divide-y divide-slate-100 mt-2">${closed.map(reportRow).join("")}</ul>
      </section>` : ""}

      <section class="card">
        <h2 class="font-display text-xl font-extrabold p-5 pb-0">Members</h2>
        <p class="px-5 pt-1 text-sm text-slate-600">${plural(a.members.length, "member", "members")}. A suspended account cannot post, join or message.</p>
        <ul class="divide-y divide-slate-100 mt-3">${a.members.map(memberRow).join("")}</ul>
      </section>

      <section class="card p-5">
        <h2 class="font-display text-xl font-extrabold">Blocked words</h2>
        <p class="mt-1 text-sm text-slate-600">Beyond money and links, which are always blocked. One word per entry, letters and numbers only.</p>
        ${a.words.length ? `<div class="mt-4 flex flex-wrap gap-2">${a.words.map((w) => `
          <span class="tag">${esc(w.word)}
            <button data-action="admin-unword" data-id="${esc(w.word)}" class="text-slate-500 hover:text-rose-700" aria-label="Remove ${esc(w.word)}">${icon("x", "w-3.5 h-3.5")}</button>
          </span>`).join("")}</div>` : `<p class="mt-4 text-sm text-slate-500">No extra words blocked.</p>`}
        <form id="word-form" class="mt-4 flex gap-2">
          <input id="word-input" class="inp" placeholder="Add a word" maxlength="40" autocomplete="off" />
          <button type="submit" class="btn-ghost shrink-0">Add</button>
        </form>
      </section>

      <section class="card p-5">
        <h2 class="font-display text-xl font-extrabold">Rejoin blocks</h2>
        <p class="mt-1 text-sm text-slate-600">Accounts deleted while suspended or reported. We keep no name and no address, only a one-way fingerprint of the email, so a block can be recognised but never traced back to a person.</p>
        ${a.blocks.length ? `<ul class="mt-4 divide-y divide-slate-100">${a.blocks.map((b) => `
          <li class="py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="font-mono font-semibold tracking-widest">${esc(b.reference)}</p>
              <p class="mt-0.5 text-sm text-slate-600">${esc(BLOCK_REASONS[b.reason] || b.reason)}
                · blocked ${new Date(b.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                · lapses ${new Date(b.expires_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</p>
            </div>
            <button data-action="lift-block" data-id="${esc(b.reference)}" class="btn-ghost py-2 shrink-0">Lift</button>
          </li>`).join("")}</ul>`
          : `<p class="mt-4 text-sm text-slate-500">No active blocks.</p>`}
        <p class="mt-4 text-sm text-slate-600">A blocked person is shown their reference when their account is deleted, and again if they try to rejoin. Ask for it before lifting anything: it is the only way to match a person to a case.</p>
      </section>

      <section class="rounded-2xl bg-ink text-white p-6">
        <h2 class="font-display text-xl font-extrabold flex items-center gap-2">${icon("eye", "w-5 h-5 text-sun")} What you can and cannot see</h2>
        <ul class="mt-4 space-y-3 text-slate-200 leading-relaxed text-sm">
          <li class="flex gap-3">${icon("check", "w-4 h-4 shrink-0 mt-0.5 text-teal-300")} You can read a trip thread only while it has an open report.</li>
          <li class="flex gap-3">${icon("x", "w-4 h-4 shrink-0 mt-0.5 text-rose-300")} You cannot read any other thread. The database refuses, not this page.</li>
          <li class="flex gap-3">${icon("file-text", "w-4 h-4 shrink-0 mt-0.5 text-teal-300")} Every read and every suspension is written to the audit log.</li>
        </ul>
      </section>
    </div>`;
  }

  // Reviews belong to the person, as a driver or as a passenger. The text is
  // the point: a number alone says almost nothing. Only the ten most recent
  // are shown, because nobody reads a hundred of them.
  function reviewList(list, key = "all") {
    if (!list || !list.length) return `<p class="mt-3 text-sm text-slate-500">No reviews yet.</p>`;
    const showAll = state.showAllReviews[key];
    const shown = showAll ? list : list.slice(0, 10);
    return `<ul class="mt-3 divide-y divide-slate-100">${shown.map((r) => `
      <li class="py-3">
        <div class="flex items-center justify-between gap-3">
          <span class="text-sm min-w-0">
            <span class="font-semibold">${esc(r.authorName || "A former member")}</span>
            <span class="text-slate-500"> on the trip, as ${r.role === "driver" ? "the driver" : "a passenger"}</span>
          </span>
          <span class="flex shrink-0" aria-label="${r.rating} out of 5">${[1,2,3,4,5].map((s) =>
            icon("star", `w-3.5 h-3.5 ${s <= r.rating ? "fill-amber-400 text-amber-400" : "text-slate-300"}`)).join("")}</span>
        </div>
        ${r.body ? `<p class="mt-1 text-sm text-slate-700 leading-relaxed">${esc(r.body)}</p>` : ""}
        <p class="mt-1 text-xs text-slate-500">${new Date(r.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</p>
      </li>`).join("")}</ul>
      ${list.length > 10 ? `<button data-action="toggle-reviews" data-id="${key}" class="mt-3 text-sm font-semibold text-teal-800 underline underline-offset-4">
        ${showAll ? "Show fewer" : `Show all ${list.length} reviews`}</button>` : ""}`;
  }

  // Both scores side by side. Being a good passenger is not the same skill
  // as being a good driver, so they never get merged into one number.
  function bothRatings(asDriver, asPassenger) {
    return `<dl class="grid grid-cols-2 gap-3">
      <div class="rounded-xl bg-slate-50 p-3"><dt class="text-sm text-slate-500">As a driver</dt><dd class="mt-1">${rating(asDriver)}</dd></div>
      <div class="rounded-xl bg-slate-50 p-3"><dt class="text-sm text-slate-500">As a passenger</dt><dd class="mt-1">${rating(asPassenger)}</dd></div>
    </dl>`;
  }

  /* ---------- Modals ---------- */
  function modalFrame(title, body) {
    return `<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="absolute inset-0 bg-ink/60" data-action="close-modal"></div>
      <div class="pop relative bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl overflow-y-auto max-h-[90vh]">
        <div class="flex items-center justify-between px-5 pt-5">
          <h2 id="modal-title" class="font-display text-2xl font-extrabold">${esc(title)}</h2>
          <button data-action="close-modal" class="w-9 h-9 grid place-items-center rounded-full hover:bg-slate-100" aria-label="Close">${icon("x", "w-5 h-5")}</button>
        </div>
        <div class="p-5">${body}</div>
      </div></div>`;
  }

  function joinModal(m) {
    const r = rideById(m.rideId);
    if (!r) return "";
    const d = r.driver || {};
    return modalFrame(`Ride with ${firstName(d.full_name) || "a member"}`, `
      <div class="rounded-xl bg-slate-50 p-4">
        ${routeInline(r.from_city, r.to_city)}
        <p class="mt-1 text-sm text-slate-600">${formatDay(r.departs_at)} at ${formatTime(r.departs_at)}. ${plural(r.seats_left, "seat", "seats")} open.</p>
      </div>

      <div class="mt-5">
        <label class="label">Where would you like to be picked up?</label>
        <div class="space-y-2">${r.meeting_points.map((p, i) => `
          <label class="flex items-center gap-3 rounded-xl border px-4 py-3 cursor-pointer ${m.pickup === p ? "border-teal-600 bg-teal-50" : "border-slate-300"}">
            <input type="radio" name="pickup" value="${esc(p)}" ${m.pickup === p ? "checked" : ""} class="w-4 h-4 accent-teal-700" data-pickup />
            <span class="font-medium">${esc(p)}</span>
          </label>`).join("")}</div>
        <p class="mt-2 text-sm text-slate-500">Wait within 200 metres of the spot you pick, so neither of you has to go looking.</p>
      </div>

      <div class="mt-5 flex items-center justify-between">
        <span class="font-semibold">Seats you need</span>
        ${stepper("join", m.seats, 1, r.seats_left)}
      </div>

      <div class="mt-5">
        <label for="join-msg" class="label">Say hi to ${esc(firstName(d.full_name) || "the driver")}</label>
        <textarea id="join-msg" rows="3" maxlength="240" class="inp resize-none" placeholder="A little about you, and anything useful for the trip."></textarea>
        <p id="join-help" class="mt-1.5 text-sm text-slate-500">The driver sees this with your request.</p>
      </div>

      <div class="mt-5">${noMoneyNote()}</div>

      <div class="mt-6 flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
        <button data-action="close-modal" class="btn-ghost">Cancel</button>
        <button id="join-confirm" data-action="confirm-join" class="btn-primary" ${state.busy ? "disabled" : ""}>Send request</button>
      </div>`);
  }

  function profileModal(m) {
    const p = m.person;
    if (!p) return modalFrame("Member", `<p class="text-slate-600">Could not load this profile.</p>`);
    const upcoming = state.rides.filter((r) => r.driver_id === p.id).length;
    return modalFrame(p.full_name, `
      <div class="flex items-center gap-4">
        ${avatar(p.full_name, "lg")}
        <div class="space-y-1.5">
          ${verifiedBadge(p.verification_level)}
          <p class="text-sm text-slate-600">Member since ${new Date(p.created_at).toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</p>
        </div>
      </div>
      <div class="mt-5">${bothRatings(m.asDriver, m.asPassenger)}</div>
      ${p.bio ? `<p class="mt-5 text-slate-700 leading-relaxed">${esc(p.bio)}</p>` : ""}
      ${upcoming ? `<p class="mt-3 text-sm font-semibold text-teal-800">${plural(upcoming, "upcoming ride", "upcoming rides")} on Lifta</p>` : ""}
      <h3 class="mt-6 font-display text-lg font-extrabold">What people say</h3>
      ${m.reviews ? reviewList(m.reviews, "other") : `<p class="mt-3 text-sm text-slate-500">${icon("loader-circle", "spin w-4 h-4 inline")} Loading…</p>`}
      ${p.id !== state.user.id ? `<button data-action="open-report" data-id="${p.id}" class="mt-6 inline-flex items-center gap-2 text-sm font-semibold text-rose-700 underline underline-offset-4">${icon("flag")} Report this person</button>` : ""}
    `);
  }

  /* ---------- Trip messages ----------
     Not a chat in the usual sense: a message thread tied to one trip,
     between the two people on it. It opens when a seat is confirmed and
     is deleted 5 days after arrival. The agreement sits locked on top. */
  function messagesModal(m) {
    const c = chatById(m.chatId);
    if (!c) return modalFrame("Trip messages", `<p class="text-slate-600">This trip is no longer available.</p>`);
    const other = otherPerson(c) || {};
    const closed = !!c.closed_at;
    const done = tripDone(c);

    const agreement = `<div class="rounded-xl bg-slate-50 border border-slate-200 p-4">
      <p class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-slate-500">
        ${icon("file-text", "w-3.5 h-3.5")} Agreement</p>
      <div class="mt-2">${routeInline(c.from_city, c.to_city)}</div>
      <dl class="mt-3 grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
        <div><dt class="text-slate-500">Departure</dt><dd class="font-medium">${formatDay(c.departs_at)} at ${formatTime(c.departs_at)}</dd></div>
        <div><dt class="text-slate-500">Meeting point</dt><dd class="font-medium">${esc(c.pickup)}</dd>
          <dd class="text-xs text-slate-500">Both wait within 200 m of it</dd></div>
        <div><dt class="text-slate-500">Seats</dt><dd class="font-medium">${c.seats}</dd></div>
        <div><dt class="text-slate-500">Agreed</dt><dd class="font-medium">${new Date(c.agreed_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</dd></div>
      </dl>
      <p class="mt-3 flex items-center gap-2 text-sm font-semibold text-teal-800">${icon("ban", "w-4 h-4")} This ride is free. No money changes hands.</p>
    </div>`;

    const thread = state.messages.length
      ? state.messages.map((msg) => {
          if (!msg.sender_id) return `<p class="text-center text-xs text-slate-500 bg-slate-100 rounded-full px-3 py-1.5 mx-auto max-w-sm">${esc(msg.body)}</p>`;
          const mine = msg.sender_id === state.user.id;
          return `<div class="flex ${mine ? "justify-end" : "justify-start"}">
            <div class="max-w-[80%] rounded-2xl px-4 py-2.5 ${mine ? "bg-ink text-white rounded-br-sm" : "bg-slate-100 text-ink rounded-bl-sm"}">
              <p class="text-sm leading-relaxed">${esc(msg.body)}</p>
              <p class="mt-1 text-xs ${mine ? "text-slate-400" : "text-slate-500"}">${formatTime(msg.created_at)}</p>
            </div></div>`;
        }).join("")
      : `<p class="text-center text-sm text-slate-500 py-4">No messages yet. The quick replies below cover most of it.</p>`;

    return modalFrame(`Trip with ${firstName(other.full_name) || "a member"}`, `
      ${agreement}

      <div id="thread" class="mt-5 space-y-3 max-h-64 overflow-y-auto">${thread}</div>

      ${closed
        ? `<p class="mt-5 rounded-xl bg-slate-100 p-3 text-sm text-slate-600">These messages are closed. You can still read them until they are deleted.</p>`
        : `<div class="mt-5">
            <div class="flex flex-wrap gap-2">${QUICK.map((q) => `
              <button data-action="quick" data-text="${esc(q)}" class="chip chip-off">${esc(q)}</button>`).join("")}</div>
            <form id="msg-form" class="mt-3 flex gap-2">
              <input id="msg-input" maxlength="500" class="inp" placeholder="Something else…" autocomplete="off" />
              <button type="submit" class="btn-primary px-4 shrink-0" aria-label="Send">${icon("send", "w-4 h-4")}</button>
            </form>
            <p id="msg-help" class="mt-1.5 text-sm text-slate-500">No money and no links. Keep it to the trip.</p>
          </div>`}

      ${done && !hasReviewed(c)
        ? `<div class="mt-5 rounded-xl border border-teal-200 bg-teal-50 p-4">
            <p class="font-semibold">How was the trip with ${esc(firstName(other.full_name))}?</p>
            <p class="mt-1 text-sm text-slate-600">Your review stays on their profile after this thread is gone.</p>
            <button data-action="open-review" data-id="${c.id}" class="btn-primary mt-3">Leave a review</button>
          </div>`
        : done && hasReviewed(c) ? `<p class="mt-5 text-sm text-slate-500">You've reviewed this trip. Thank you.</p>` : ""}

      ${!done ? `<div class="mt-5 rounded-xl border border-slate-200 p-4">
        <p class="flex items-center gap-2 font-semibold">${icon("shield-check", "w-4 h-4 text-teal-700")} Tell someone where you are going</p>
        <p class="mt-1 text-sm text-slate-600">Send a link to a friend or someone at home. They see who you are with, the route and when you should arrive. No account needed, and they see nothing else.</p>
        ${state.shareLinks[c.id]
          ? `<div class="mt-3">
              <input readonly value="${esc(location.origin + location.pathname + "?t=" + state.shareLinks[c.id])}"
                class="inp text-sm" onclick="this.select()" aria-label="Link to share" />
              <div class="mt-2 flex flex-wrap gap-3">
                <button data-action="copy-share" data-id="${c.id}" class="btn-ghost py-2">${icon("copy")} Copy link</button>
                <button data-action="revoke-share" data-id="${c.id}" class="text-sm font-semibold text-rose-700 underline underline-offset-4">Stop sharing</button>
              </div>
              <p class="mt-2 text-xs text-slate-500">The link stops working 12 hours after departure.</p>
            </div>`
          : `<button data-action="share-trip" data-id="${c.id}" class="btn-ghost py-2 mt-3">${icon("share-2")} Create a link</button>`}
      </div>` : ""}

      <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-4">
        <p class="flex items-center gap-2 text-xs text-slate-500">
          ${icon("trash-2", "w-3.5 h-3.5")} Deleted in ${plural(daysLeft(c), "day", "days")}, on ${new Date(c.delete_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</p>
        <div class="flex gap-3">
          <button data-action="open-report" data-id="${other.id}" data-chat="${c.id}" class="text-sm font-semibold text-rose-700 underline underline-offset-4">Report</button>
          <button data-action="block" data-id="${other.id}" class="text-sm font-semibold text-rose-700 underline underline-offset-4">Block</button>
        </div>
      </div>`);
  }

  /* ---------- Review: short, and about the person, not the ride ---------- */
  function reviewModal(m) {
    const c = chatById(m.chatId);
    if (!c) return "";
    const other = otherPerson(c) || {};
    const role = iAmDriver(c) ? "passenger" : "driver";
    return modalFrame(`Review ${firstName(other.full_name)}`, `
      <p class="text-slate-600">As a ${role} on ${esc(c.from_city)} to ${esc(c.to_city)}.</p>

      <div class="mt-5 flex justify-center gap-1" role="group" aria-label="Rating">
        ${[1,2,3,4,5].map((n) => `<button data-action="set-rating" data-id="${n}" class="p-1.5" aria-label="${n} ${n === 1 ? "star" : "stars"}">
          ${icon("star", `w-9 h-9 ${n <= m.rating ? "fill-amber-400 text-amber-400" : "text-slate-300"}`)}</button>`).join("")}
      </div>

      <div class="mt-5">
        <label for="rev-body" class="label">A line about the trip (optional)</label>
        <textarea id="rev-body" rows="2" maxlength="150" class="inp resize-none" placeholder="Punctual, easy company, and we talked the whole way."></textarea>
        <p id="rev-help" class="mt-1.5 text-sm text-slate-500">0/150. Keep it short and about the person.</p>
      </div>

      <div class="mt-6 flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
        <button data-action="close-modal" class="btn-ghost">Not now</button>
        <button id="rev-send" data-action="send-review" class="btn-primary" ${m.rating ? "" : "disabled"}>Submit review</button>
      </div>`);
  }

  /* ---------- Report ---------- */
  function reportModal(m) {
    return modalFrame("Report a problem", `
      <p class="text-slate-600">The Lifta team looks at every report. If this is about a trip, those messages are kept as a record until the case is closed.</p>

      <div class="mt-5 space-y-2" role="group" aria-label="Reason">
        ${REPORT_REASONS.map(([id, label]) => `
          <label class="flex items-center gap-3 rounded-xl border px-4 py-3 cursor-pointer ${m.reason === id ? "border-teal-600 bg-teal-50" : "border-slate-300"}">
            <input type="radio" name="reason" value="${id}" ${m.reason === id ? "checked" : ""} class="w-4 h-4 accent-teal-700" data-reason />
            <span class="font-medium">${label}</span>
          </label>`).join("")}
      </div>

      <div class="mt-5">
        <label for="rep-details" class="label">What happened? (optional)</label>
        <textarea id="rep-details" rows="3" maxlength="500" class="inp resize-none" placeholder="Anything that helps us understand."></textarea>
      </div>

      <div class="mt-6 flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
        <button data-action="close-modal" class="btn-ghost">Cancel</button>
        <button data-action="send-report" class="btn-primary" ${m.reason ? "" : "disabled"}>Send report</button>
      </div>`);
  }

  function renderModal() {
    const root = $("#modal-root");
    const m = state.modal;
    root.innerHTML = !m ? ""
      : m.type === "join" ? joinModal(m)
      : m.type === "messages" ? messagesModal(m)
      : m.type === "review" ? reviewModal(m)
      : m.type === "report" ? reportModal(m)
      : profileModal(m);
    document.body.style.overflow = m ? "hidden" : "";
    refreshIcons();
    const thread = $("#thread");
    if (thread) thread.scrollTop = thread.scrollHeight;
  }

  /* ---------- Shell ---------- */
  const NAV = [
    { id: "find",    label: "Find a ride", icon: "search" },
    { id: "post",    label: "Post a ride", icon: "plus" },
    { id: "trips",   label: "My trips",    icon: "route" },
    { id: "archive", label: "Archive",     icon: "archive" },
    { id: "profile", label: "Profile",     icon: "user" },
  ];
  // Admin is a fifth tab, and only admins ever see it.
  const navItems = () => state.profile?.role === "admin"
    ? [...NAV, { id: "admin", label: "Admin", icon: "shield" }]
    : NAV;

  const logo = `<span class="inline-flex items-center gap-2.5">
    <span class="w-9 h-9 rounded-xl bg-ink grid place-items-center" aria-hidden="true"><span class="road-v" style="height:22px;min-height:0;width:8px"></span></span>
    <span class="font-display text-2xl font-extrabold tracking-tight">Lifta</span></span>`;

  const banner = `<div class="bg-sun text-ink" role="note">
    <p class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-center gap-2 text-sm font-semibold text-center">
      ${icon("heart-handshake", "w-4 h-4 shrink-0")}
      Lifta is always free. Never ask for or offer money. You share the ride for the company.
    </p></div>`;

  function shell(content) {
    // Two badges, each counting only what that tab can do something about.
    // My trips: requests waiting for an answer, and unread messages on a
    // trip that has not happened yet.
    const tripsCount = state.rides
      .filter((r) => r.driver_id === state.user.id)
