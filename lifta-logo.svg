<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lifta" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lifta</title>

  <!-- Mediterranean night, the app's ink colour -->
  <rect width="512" height="512" rx="114" fill="#102A3A"/>

  <!-- The road: asphalt with a dashed centre line, the same motif that
       connects departure and destination on every ride card -->
  <g>
    <rect x="228" y="100" width="56" height="312" rx="28" fill="#2B4254"/>
    <line x1="256" y1="100" x2="256" y2="412"
          stroke="#FFC53D" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="31 25"/>
  </g>
</svg>
