<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Lifta" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lifta</title>

  <defs>
    <!-- The Figtree stack the app uses, with a real fallback -->
    <style>
      .word { font-family: "Bricolage Grotesque", Figtree, "Helvetica Neue", Arial, sans-serif;
              font-weight: 800; letter-spacing: -1.5px; }
      .line { font-family: Figtree, "Helvetica Neue", Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Mediterranean night -->
  <rect width="1600" height="400" fill="#102A3A"/>

  <!-- The words sit above the road, as they do on the site -->
  <text x="110" y="168" class="word" font-size="86" fill="#FFFFFF">Lifta</text>
  <text x="110" y="222" class="line" font-size="30" fill="#94A9B5">Going somewhere? Take someone along.</text>

  <!-- The road: asphalt band with a dashed centre line -->
  <rect x="0" y="296" width="1600" height="66" fill="#1C3B4F"/>
  <line x1="0" y1="329" x2="1600" y2="329"
        stroke="#FFC53D" stroke-width="4" stroke-dasharray="20 20"/>

  <!-- The car, parked where the animation ends on the site. Drawn filled
       rather than as a thin outline so it still reads at thumbnail size. -->
  <g transform="translate(1215 288)">
    <!-- body -->
    <path d="M6 40 L12 19 A6 6 0 0 1 18 15 H52 A6 6 0 0 1 58 19 L64 40 Z" fill="#FFC53D"/>
    <rect x="2" y="38" width="66" height="16" rx="7" fill="#FFC53D"/>
    <!-- windows, cut from the body in the dark of the road -->
    <path d="M17 36 L21 23 A2 2 0 0 1 23 21 H33 V36 Z" fill="#1C3B4F"/>
    <path d="M37 21 H47 A2 2 0 0 1 49 23 L53 36 H37 Z" fill="#1C3B4F"/>
    <!-- wheels -->
    <circle cx="18" cy="55" r="7" fill="#102A3A"/>
    <circle cx="52" cy="55" r="7" fill="#102A3A"/>
    <circle cx="18" cy="55" r="3" fill="#FFC53D"/>
    <circle cx="52" cy="55" r="3" fill="#FFC53D"/>
  </g>
</svg>
